name: Probe ASUS 52334 JFFS backup restore backend

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/jffs-backup-52334-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch and extract verified ASUS 52334
        run: |
          set -euo pipefail
          mkdir -p work/asus work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/fw.zip             'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/fw.zip' | sha256sum -c -
          unzip -q work/artifacts/fw.zip -d work/asus
          cd work/asus
          FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
          test -n "$FW"
          binwalk -Me "$FW" >/dev/null
          cd ../..
          ROOT="$(find work/asus -type d -name rootfs_ubifs -print -quit)"
          test -n "$ROOT"
          echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Probe JFFS backup restore surface
        run: |
          set -euo pipefail
          R="$ASUS_ROOT"
          OUT=reports/jffs-backup-52334-compatibility.txt
          : > "$OUT"
          section() { printf '\n===== %s =====\n' "$1" >> "$OUT"; }

          section 'STOCK SETTINGS BACKUP PAGE'
          P="$R/www/Advanced_SettingBackup_Content.asp"
          if [ -f "$P" ]; then
            sha256sum "$P" >> "$OUT"
            grep -nEi -A14 -B8 'jffs|backup_jffs|upload|restore' "$P" | head -n 600 >> "$OUT" || true
          else
            echo 'MISSING Advanced_SettingBackup_Content.asp' >> "$OUT"
          fi

          section 'JFFS WEB PAGES'
          find "$R/www" -maxdepth 1 -type f \( -iname '*jffs*' -o -iname '*settingbackup*' \) -printf '%f\n' | sort >> "$OUT" || true

          section 'HTTPD / UPLOADER TOKENS'
          for rel in usr/sbin/httpd usr/sbin/uploader usr/bin/uploader sbin/rc; do
            [ -f "$R/$rel" ] || continue
            echo "--- $rel ---" >> "$OUT"
            strings -a "$R/$rel" | grep -Ei               'backup_jffs|upload_jffs|jffs.*profile|gen_jffs|savejffs|restore.*jffs|jffs.*restore|UploadingJFFS'               | sort -u >> "$OUT" || true
          done

          section 'CGI / ROUTE REFERENCES'
          grep -RInaE --binary-files=without-match             'backup_jffs|upload_jffs|UploadingJFFS|jffs.*\.tar|\.tar.*jffs'             "$R/www" 2>/dev/null | head -n 500 >> "$OUT" || true

          section 'CLASSIFICATION'
          page_refs=$(grep -Eic 'backup_jffs|jffs.*\.tar|\.tar.*jffs' "$P" 2>/dev/null || true)
          binary_refs=0
          for rel in usr/sbin/httpd usr/sbin/uploader usr/bin/uploader; do
            [ -f "$R/$rel" ] || continue
            strings -a "$R/$rel" | grep -Eiq 'backup_jffs|upload_jffs|gen_jffs_backup_profile|upload_jffs_profile' && binary_refs=$((binary_refs+1)) || true
          done
          echo "page_refs=$page_refs" >> "$OUT"
          echo "binary_components_with_jffs_backup_tokens=$binary_refs" >> "$OUT"
          if [ "$page_refs" -gt 0 ] && [ "$binary_refs" -gt 0 ]; then
            echo 'CLASSIFICATION=STOCK_OR_ADAPT_BACKEND_PRESENT' >> "$OUT"
          elif [ "$binary_refs" -gt 0 ]; then
            echo 'CLASSIFICATION=UI_ADAPT_CANDIDATE' >> "$OUT"
          else
            echo 'CLASSIFICATION=SOURCE_BACKEND_REQUIRED' >> "$OUT"
          fi
          cat "$OUT"
      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: jffs-backup-52334-compatibility
          path: reports/jffs-backup-52334-compatibility.txt
          if-no-files-found: error
          retention-days: 14
