name: Verify M48 cstats HND no-port classification

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/per-ip-traffic-hnd-donor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Merlin donor
        run: |
          set -euo pipefail
          mkdir -p work reports
          git init work/merlin
          git -C work/merlin remote add origin https://github.com/RMerl/asuswrt-merlin.ng.git
          git -C work/merlin sparse-checkout init --cone
          git -C work/merlin sparse-checkout set             release/src/router/cstats             release/src/router/rc             release/src/router/shared             release/src/router/httpd             release/src/router/www             release/src/router/Makefile
          git -C work/merlin fetch --depth=1 --filter=blob:none origin 6a5df61aab6f3fa2dffc518994d42e4f2a27fb2b
          git -C work/merlin checkout --detach FETCH_HEAD

      - name: Verify complete HND exclusion
        run: |
          set -euo pipefail
          M=work/merlin
          OUT=reports/per-ip-traffic-hnd-donor.txt
          : > "$OUT"

          pass() { echo "PASS $*" | tee -a "$OUT"; }
          fail() { echo "FAIL $*" | tee -a "$OUT"; return 1; }
          have() { grep -Fq "$2" "$1" && pass "$3" || fail "$3"; }

          test -f "$M/release/src/router/cstats/cstats.c"             && pass "Legacy cstats source exists in shared donor tree"             || fail "cstats source unexpectedly missing"

          have "$M/release/src/router/Makefile" 'ifneq ($(HND_ROUTER),y)'             "Router build contains HND exclusion guard"
          python3 - <<'PY' | tee -a "$OUT"
from pathlib import Path
p=Path("work/merlin/release/src/router/Makefile").read_text()
needle="ifneq ($(HND_ROUTER),y)\nobj-y += cstats\nendif"
assert needle in p, "cstats is not explicitly excluded from HND build"
print("PASS cstats daemon is not built when HND_ROUTER=y")
PY

          python3 - <<'PY' | tee -a "$OUT"
from pathlib import Path
p=Path("work/merlin/release/src/router/rc/services.c").read_text()
assert '#if !defined(HND_ROUTER)\n\tstop_cstats();' in p
assert '#if !defined(HND_ROUTER)\n\trestart_cstats();' in p
assert '#if !defined(HND_ROUTER)\nvoid stop_cstats(void)' in p
print("PASS cstats rc lifecycle is excluded on HND")
PY

          python3 - <<'PY' | tee -a "$OUT"
from pathlib import Path
p=Path("work/merlin/release/src/router/rc/firewall.c").read_text()
assert '#if !defined(HND_ROUTER)' in p
block=p[p.index('// Setup traffic accounting'):p.index('// Setup traffic accounting')+500]
assert 'cstats_enable' in block and 'ipt_account(fp, NULL);' in block
print("PASS cstats firewall accounting is under non-HND guard")
PY

          python3 - <<'PY' | tee -a "$OUT"
from pathlib import Path
p=Path("work/merlin/release/src/router/httpd/data_arrays.h").read_text()
start=p.index('#if !defined(HND_ROUTER)')
end=p.index('#endif', start)
block=p[start:end]
for token in ['ej_iptmon','ej_ipt_bandwidth','ej_iptraffic','iptraffic_conntrack_init']:
    assert token in block, token
print("PASS per-IP HTTPD handlers are non-HND only")
PY

          python3 - <<'PY' | tee -a "$OUT"
from pathlib import Path
p=Path("work/merlin/release/src/router/www/Makefile").read_text()
needle='''ifeq ($(HND_ROUTER),y)
\trm -rf $(INSTALLDIR)/www/Main_TrafficMonitor_devdaily.asp
\trm -rf $(INSTALLDIR)/www/Main_TrafficMonitor_devmonthly.asp
\trm -rf $(INSTALLDIR)/www/Main_TrafficMonitor_devrealtime.asp
endif'''
assert needle in p
print("PASS per-device traffic pages are removed from HND images")
PY

          have "$M/release/src/router/cstats/cstats.c" '/proc/net/ipt_account/lan'             "Legacy cstats daemon depends on ipt_account procfs backend"

          echo 'CLASSIFICATION M48_NO_PORT_PINNED_HND_DONOR' | tee -a "$OUT"

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-ip-traffic-hnd-donor
          path: reports/per-ip-traffic-hnd-donor.txt
          if-no-files-found: warn
          retention-days: 30
