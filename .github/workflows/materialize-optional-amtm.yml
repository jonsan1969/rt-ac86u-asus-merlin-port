name: Materialize pinned AMTM optional payload

on:
  workflow_dispatch:
  push:
    branches: [asus-52334-merlin-port]
    paths:
      - .github/workflows/materialize-optional-amtm.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Merlin source only
        run: |
          set -euo pipefail
          mkdir -p work/merlin
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o work/merlin/amtm \
            'https://raw.githubusercontent.com/RMerl/asuswrt-merlin.ng/6a5df61aab6f3fa2dffc518994d42e4f2a27fb2b/release/src/router/others/amtm'
      - name: Verify dormant AMTM donor
        run: |
          set -euo pipefail
          p=work/merlin/amtm
          test -f "$p"
          got="$(sha256sum "$p" | awk '{print $1}')"
          test "$got" = '283fa24cec4cb7df84fa6d7f1e5cde82b164f28a675ebe5167127c8a891bc7ba'
          sh -n "$p"
          grep -Fq '/jffs/addons/amtm' "$p"
          grep -Fq 'jffs2_scripts' "$p"
          grep -Fq '/usr/sbin/curl' "$p"
      - name: Publish verified donor only
        uses: actions/upload-artifact@v4
        with:
          name: pinned-amtm-dormant
          path: work/merlin/amtm
          if-no-files-found: error
          retention-days: 14
