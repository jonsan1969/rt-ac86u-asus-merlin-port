name: Validate guarded Merlin overlay

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - ports/**
      - tools/apply_port_overlay.py
      - tools/check_port_overlay.py
      - .github/workflows/validate-dns-director-overlay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Validate overlay manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_port_overlay.py ports/active.json

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip binutils
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch verified ASUS 52334 and pinned Merlin source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/asus work/artifacts work/merlin-src reports

          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o work/artifacts/FW_RT-AC86U_300438652334.zip \
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/FW_RT-AC86U_300438652334.zip' | sha256sum -c -
          unzip -q work/artifacts/FW_RT-AC86U_300438652334.zip -d work/asus

          rm -rf work/merlin-src
          git clone --depth 1 --branch 386.14_2 --single-branch \
            https://github.com/RMerl/asuswrt-merlin.ng.git work/merlin-src
          test "$(git -C work/merlin-src rev-parse HEAD)" = '6a5df61aab6f3fa2dffc518994d42e4f2a27fb2b'

      - name: Extract ASUS rootfs
        shell: bash
        run: |
          set -euo pipefail
          cd work/asus
          FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
          test -n "$FW"
          binwalk -Me "$FW" >/dev/null
          cd ../..
          ASUS_ROOT="$(find work/asus -type d -name rootfs_ubifs -print -quit)"
          test -n "$ASUS_ROOT"
          echo "ASUS_ROOT=$ASUS_ROOT" >> "$GITHUB_ENV"

      - name: Inventory rootfs before overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path(os.environ["ASUS_ROOT"])

          def digest(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""):
                      h.update(c)
              return h.hexdigest()

          inv={}
          for p in sorted(root.rglob("*")):
              rel=p.relative_to(root).as_posix()
              if p.is_symlink():
                  inv[rel]=["L",os.readlink(p)]
              elif p.is_file():
                  inv[rel]=["F",digest(p),p.stat().st_mode & 0o7777]
              elif p.is_dir():
                  inv[rel]=["D",p.stat().st_mode & 0o7777]

          Path("reports/rootfs-before.json").write_text(
              json.dumps(inv,sort_keys=True,separators=(",",":")),encoding="utf-8")

          sensitive=[
              "sbin/rc",
              "usr/sbin/httpd",
              "usr/sbin/dnsmasq",
              "bin/busybox",
              "www/state.js",
              "www/require/modules/menuTree.js",
          ]
          for optional in ["usr/sbin/openvpn","usr/bin/dropbearmulti"]:
              if (root/optional).is_file():
                  sensitive.append(optional)

          with open("reports/sensitive-before.tsv","w",encoding="utf-8") as f:
              f.write("path\tsha256\n")
              for rel in sensitive:
                  p=root/rel
                  if p.is_file():
                      f.write(f"{rel}\t{digest(p)}\n")

          (Path("reports/menuTree.before.js")).write_bytes(
              (root/"www/require/modules/menuTree.js").read_bytes())
          PY

      - name: Apply guarded overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_port_overlay.py \
            --rootfs "$ASUS_ROOT" \
            --merlin-src work/merlin-src \
            --repo-root . \
            --manifest ports/active.json \
            --report reports/port-overlay-provenance.tsv

      - name: Verify exact change set and backend compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path(os.environ["ASUS_ROOT"])
          before=json.loads(Path("reports/rootfs-before.json").read_text(encoding="utf-8"))

          def digest(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""):
                      h.update(c)
              return h.hexdigest()

          after={}
          for p in sorted(root.rglob("*")):
              rel=p.relative_to(root).as_posix()
              if p.is_symlink():
                  after[rel]=["L",os.readlink(p)]
              elif p.is_file():
                  after[rel]=["F",digest(p),p.stat().st_mode & 0o7777]
              elif p.is_dir():
                  after[rel]=["D",p.stat().st_mode & 0o7777]

          changed=sorted(k for k in set(before)|set(after) if before.get(k)!=after.get(k))
          manifest=json.loads(Path("ports/active.json").read_text(encoding="utf-8"))
          expected=sorted(e["target"].lstrip("/") for e in manifest["entries"])
          if len(expected) != len(set(expected)):
              raise SystemExit("manifest contains duplicate overlay targets")
          Path("reports/changed-paths.txt").write_text("\n".join(changed)+"\n",encoding="utf-8")
          if changed != expected:
              raise SystemExit(f"unexpected rootfs changes: {changed!r}; expected {expected!r}")

          sensitive_before={}
          for line in Path("reports/sensitive-before.tsv").read_text(encoding="utf-8").splitlines()[1:]:
              p,h=line.split("\t",1)
              sensitive_before[p]=h

          protected=[
              "sbin/rc",
              "usr/sbin/httpd",
              "usr/sbin/dnsmasq",
              "bin/busybox",
          ]
          for optional in ["usr/sbin/openvpn","usr/bin/dropbearmulti"]:
              if optional in sensitive_before:
                  protected.append(optional)

          with open("reports/sensitive-after.tsv","w",encoding="utf-8") as f:
              f.write("path\tsha256\n")
              for rel in protected:
                  h=digest(root/rel)
                  f.write(f"{rel}\t{h}\n")
                  if h != sensitive_before[rel]:
                      raise SystemExit(f"protected ASUS file changed: {rel}")

          page=(root/"www/DNSFilter.asp").read_text(encoding="utf-8")
          required=[
              'dnsfilter_enable_x',
              'dnsfilter_mode',
              'dnsfilter_rulelist',
              'dnsfilter_custom1',
              'dnsfilter_custom2',
              'dnsfilter_custom3',
              'action_mode',
              'action_script',
              '/start_apply.htm',
              'document.form.submit()',
          ]
          forbidden=[
              'dnsfilter_rulelist1',
              'dnsfilter_rulelist2',
              'dnsfilter_rulelist3',
              'dnsfilter_rulelist4',
              'dnsfilter_rulelist5',
              'dnsfilter_custom61',
              'dnsfilter_custom62',
              'dnsfilter_custom63',
          ]
          missing=[x for x in required if x not in page]
          present_forbidden=[x for x in forbidden if x in page]
          if missing:
              raise SystemExit(f"adapter missing required ASUS apply/NVRAM contract identifiers: {missing}")
          if present_forbidden:
              raise SystemExit(f"adapter references unsupported Merlin-only identifiers: {present_forbidden}")

          menu=(root/"www/require/modules/menuTree.js").read_text(encoding="utf-8")
          tools_index='index: "menu_Tools"'
          tools_page='{url: "Tools_OtherSettings.asp", tabName: "Other Settings"}'
          monthly_page='{url: "Main_TrafficMonitor_monthly.asp", tabName: "Monthly Traffic"}'
          survey_page='{url: "Advanced_Wireless_Survey.asp", tabName: "Site Survey"}'
          if menu.count(tools_index) != 1:
              raise SystemExit("menuTree.js Tools menu index not present exactly once")
          if menu.count(tools_page) != 1:
              raise SystemExit("menuTree.js Other Settings entry not present exactly once")
          if menu.count(monthly_page) != 1:
              raise SystemExit("menuTree.js Monthly Traffic entry not present exactly once")
          if menu.count(survey_page) != 1:
              raise SystemExit("menuTree.js Site Survey entry not present exactly once")

          other=(root/"www/Tools_OtherSettings.asp").read_text(encoding="utf-8")
          other_required=[
              'name="ct_tcp_timeout"',
              'name="ct_udp_timeout"',
              'FormActions("start_apply.htm", "apply", "reboot", "<% get_default_reboot_time(); %>");',
              'tcp_established',
              'udp_unreplied',
              'udp_assured',
              'name="shell_timeout"',
              'shell_timeout_x',
              'name="rstats_bak"',
              'name="rstats_stime"',
              'name="rstats_offset"',
          ]
          other_forbidden=[
              'ct_max',
              'rstats_path',
              'rstats_new',
              'cstats_enable',
              'dns_local_cache',
              'ntpd_enable',
              'ntpd_server_redir',
              'restart_conntrack',
          ]
          missing_other=[x for x in other_required if x not in other]
          forbidden_other=[x for x in other_forbidden if x in other]
          if missing_other:
              raise SystemExit(f"Other Settings adapter missing verified contract: {missing_other}")
          if forbidden_other:
              raise SystemExit(f"Other Settings adapter exposes unverified backend controls: {forbidden_other}")

          state=(root/"www/state.js").read_text(encoding="utf-8")
          if state.count('var dnsfilter_support = isSupport("dnsfilter");') != 1:
              raise SystemExit("state.js DNSFilter support declaration not present exactly once")
          if 'dnsfilter_support = false;' in state:
              raise SystemExit("state.js still forcibly disables DNSFilter support")

          profile=(root/"rom/etc/profile").read_text(encoding="utf-8")
          profile_required=[
              '/opt/sbin:/opt/bin:/opt/usr/sbin:/opt/usr/bin',
              '[ -f /opt/etc/profile ] && . /opt/etc/profile',
              'TMOUT="$(nvram get shell_timeout 2>/dev/null)"',
              '[ "$(nvram get jffs2_scripts)" = "1" ] && [ -f /jffs/configs/profile.add ] && . /jffs/configs/profile.add',
          ]
          missing_profile=[x for x in profile_required if x not in profile]
          if missing_profile:
              raise SystemExit(f"shell profile missing required additive Merlin contract: {missing_profile}")
          gated_profile_add='[ "$(nvram get jffs2_scripts)" = "1" ] && [ -f /jffs/configs/profile.add ] && . /jffs/configs/profile.add'
          if profile.count(gated_profile_add) != 1:
              raise SystemExit("shell profile gated profile.add hook not present exactly once")

          helper_path=root/"usr/sbin/helper.sh"
          helper=helper_path.read_text(encoding="utf-8")
          helper_required=[
              'pc_insert()',
              'pc_replace()',
              'pc_append()',
              'pc_delete()',
              'am_get_webui_page()',
              '_am_settings_path=/jffs/addons/custom_settings.txt',
              'am_settings_get()',
              'am_settings_set()',
          ]
          missing_helper=[x for x in helper_required if x not in helper]
          if missing_helper:
              raise SystemExit(f"Merlin addon helper missing required API: {missing_helper}")
          if (helper_path.stat().st_mode & 0o777) != 0o755:
              raise SystemExit("Merlin addon helper mode is not 0755")

          monthly=(root/"www/Main_TrafficMonitor_monthly.asp").read_text(encoding="utf-8-sig")
          monthly_required=[
              '<% bandwidth("monthly"); %>',
              'monthly_history',
              '/js/chart.min.js',
              'Main_TrafficMonitor_realtime.asp',
              'Main_TrafficMonitor_last24.asp',
              'Main_TrafficMonitor_daily.asp',
          ]
          monthly_forbidden=[
              'cstats_enable',
              'Main_TrafficMonitor_devrealtime.asp',
              'Main_TrafficMonitor_devdaily.asp',
              'Main_TrafficMonitor_devmonthly.asp',
          ]
          missing_monthly=[x for x in monthly_required if x not in monthly]
          forbidden_monthly=[x for x in monthly_forbidden if x in monthly]
          if missing_monthly:
              raise SystemExit(f"Monthly Traffic adapter missing required global-rstats contract: {missing_monthly}")
          if forbidden_monthly:
              raise SystemExit(f"Monthly Traffic adapter exposes unsupported per-device surface: {forbidden_monthly}")
          chart=root/"www/js/chart.min.js"
          if not chart.is_file() or chart.stat().st_size < 100000:
              raise SystemExit("Chart.js monthly traffic asset missing or unexpectedly small")

          for i in range(1,21):
              slot=root/f"www/user{i}.asp"
              if not slot.is_symlink():
                  raise SystemExit(f"custom WebUI slot is not a symlink: /www/user{i}.asp")
              expected_target=f"user/user{i}.asp"
              if os.readlink(slot) != expected_target:
                  raise SystemExit(f"custom WebUI slot target mismatch: /www/user{i}.asp -> {os.readlink(slot)!r}")

          oui_path=root/"www/ajax/ouiDB.json"
          if digest(oui_path) != "079e881ae86ae8ba503aed0aa7d4c1dca93e4c1f318829e674541ecb23de18a4":
              raise SystemExit("local OUI database checksum mismatch")
          remote_oui="https://nw-dlcdnet.asus.com/plugin/js/ouiDB.json"
          local_oui="/ajax/ouiDB.json"
          for rel in ["www/index.asp","www/client_function.js","www/device-map/clients.asp"]:
              content=(root/rel).read_text(encoding="utf-8")
              if remote_oui in content:
                  raise SystemExit(f"remote OUI lookup still present: {rel}")
              if content.count(local_oui) != 1:
                  raise SystemExit(f"local OUI lookup not present exactly once: {rel}")

          qr=root/"www/js/qrcode.min.js"
          if digest(qr) != "7f5a45e2791b3ef6cde1a34a253711b7510ad7c6136d20fc91404b48f744647b":
              raise SystemExit("QR library checksum mismatch")

          guest=(root/"www/Guest_network.asp").read_text(encoding="utf-8")
          guest_required=[
              'src="js/qrcode.min.js"',
              'function genQRCodes(gn_array, unit)',
              'genQRCodes(gn_array_2g_tmp, 0);',
              'genQRCodes(gn_array_5g_tmp, 1);',
              'id="showqrdiv',
              'id="qrcodepanel',
              "text: 'WIFI:'",
          ]
          missing_guest=[x for x in guest_required if x not in guest]
          if missing_guest:
              raise SystemExit(f"Guest Network QR adapter missing contract: {missing_guest}")
          if guest.count('function genQRCodes(gn_array, unit)') != 1:
              raise SystemExit("Guest Network QR generator not present exactly once")

          router=(root/"www/device-map/router.asp").read_text(encoding="utf-8")
          router_required=[
              'src="../js/qrcode.min.js"',
              'function genQRCodes(){',
              'wl0_closed',
              'wl1_closed',
              'genQRCodes();',
              'id="showqrdiv',
              'id="qrcodepanel',
              "text: 'WIFI:'",
          ]
          missing_router=[x for x in router_required if x not in router]
          if missing_router:
              raise SystemExit(f"Router-map QR adapter missing contract: {missing_router}")
          if router.count('function genQRCodes(){') != 1:
              raise SystemExit("Router-map QR generator not present exactly once")

          temperature=(root/"www/Advanced_PerformanceTuning_Content.asp").read_text(encoding="utf-8")
          temperature_required=[
              '/ajax_coretmp.asp',
              'curr_coreTmp_2',
              'curr_coreTmp_5',
              'curr_cpuTemp',
              'setTimeout(update_temp, 5000)',
              '2.4 GHz radio',
              '5 GHz radio',
              'CPU',
          ]
          missing_temperature=[x for x in temperature_required if x not in temperature]
          if missing_temperature:
              raise SystemExit(f"temperature adapter missing ASUS runtime contract: {missing_temperature}")
          if 'sysinfo("temperature.' in temperature or 'fan.svg' in temperature:
              raise SystemExit("temperature adapter references unsupported Merlin-only temperature path")
          stock_ajax=(root/"www/ajax_coretmp.asp").read_text(encoding="utf-8-sig")
          for sig in ['get_fanctrl_info','curr_coreTmp_2','curr_coreTmp_5','curr_cpuTemp']:
              if sig not in stock_ajax:
                  raise SystemExit(f"stock ASUS temperature endpoint missing {sig}")
          if menu.count('{url: "Advanced_PerformanceTuning_Content.asp", tabName: "<#2069#>"}') != 1:
              raise SystemExit("stock ASUS temperature menu slot not present exactly once")

          system_log=(root/"www/Main_LogStatus_Content.asp").read_text(encoding="utf-8")
          wireless_log=(root/"www/Main_WStatus_Content.asp").read_text(encoding="utf-8")
          for label,content in [("System Log",system_log),("Wireless Log",wireless_log)]:
              if content.count("AUTOLOGOUT_MAX_MINUTE = 0;") != 1:
                  raise SystemExit(f"{label} disable-autologout contract not present exactly once")

          survey=(root/"www/Advanced_Wireless_Survey.asp").read_text(encoding="utf-8")
          survey_required=[
              '/apscan.asp',
              'restart_wlcscan',
              'flag" value="sitesurvey',
              'wlc_scan_state',
              'aplist',
              'safeText',
              '2.4 GHz',
              '5 GHz',
              'BSSID',
          ]
          missing_survey=[x for x in survey_required if x not in survey]
          if missing_survey:
              raise SystemExit(f"Site Survey adapter missing ASUS runtime contract: {missing_survey}")
          stock_apscan=(root/"www/apscan.asp").read_text(encoding="utf-8-sig")
          for sig in ['wlc_scan_state','aplist = [<% get_ap_info(); %>][0]']:
              if sig not in stock_apscan:
                  raise SystemExit(f"stock ASUS apscan endpoint missing {sig}")
          PY

          check_backend_signature() {
            local binary="$1"
            local signature="$2"
            local label="$3"
            if strings -a "$binary" | grep -Fxq "$signature"; then
              echo "PASS backend signature: $label [$binary :: $signature]"
            else
              echo "ERROR missing backend signature: $label [$binary :: $signature]" >&2
              return 1
            fi
          }

          backend_failed=0
          check_backend_signature "$ASUS_ROOT/sbin/rc" 'dnsfilter_rulelist' 'DNSFilter rule list NVRAM' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/sbin/rc" 'dnsfilter_custom1' 'DNSFilter custom resolver NVRAM' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/usr/sbin/httpd" 'dnsfilter_modes_list' 'DNSFilter mode-list EJ handler' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/usr/sbin/httpd" 'shell_timeout' 'Shell timeout NVRAM form backend' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/usr/lib/libshared.so" 'rstats_bak' 'Traffic history NVRAM-backup default' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/usr/lib/libshared.so" 'rstats_stime' 'Traffic history save-interval default' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/usr/lib/libshared.so" 'rstats_offset' 'Traffic history monthly-cycle default' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/bin/rstats" 'rstats_stime' 'Traffic history daemon save interval' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/bin/rstats" 'rstats_offset' 'Traffic history daemon monthly cycle' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/bin/rstats" '*nvram' 'Traffic history daemon NVRAM storage mode' || backend_failed=1
          check_backend_signature "$ASUS_ROOT/usr/sbin/httpd" '/var/spool/rstats-history.js' 'Traffic history EJ spool' || backend_failed=1
          if strings -a "$ASUS_ROOT/bin/rstats" | grep -Fq 'MONTHLY: p='; then
            echo 'PASS backend signature: monthly rstats history'
          else
            echo 'ERROR missing backend signature: monthly rstats history' >&2
            backend_failed=1
          fi
          if (( backend_failed )); then
            echo 'ERROR: one or more required ASUS 52334 backend signatures are missing' >&2
            exit 1
          fi

          diff -u \
            --label ASUS-52334/menuTree.js \
            --label overlay/menuTree.js \
            reports/menuTree.before.js \
            "$ASUS_ROOT/www/require/modules/menuTree.js" \
            > reports/menuTree.patch.diff || test $? -eq 1

          cat reports/changed-paths.txt
          cat reports/port-overlay-provenance.tsv
          cat reports/menuTree.patch.diff

      - name: Publish text reports only
        uses: actions/upload-artifact@v4
        with:
          name: guarded-merlin-overlay-validation
          path: |
            reports/changed-paths.txt
            reports/port-overlay-provenance.tsv
            reports/sensitive-before.tsv
            reports/sensitive-after.tsv
            reports/menuTree.patch.diff
          if-no-files-found: error
          retention-days: 14
