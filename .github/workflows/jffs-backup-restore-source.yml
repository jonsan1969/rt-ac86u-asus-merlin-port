name: Verify JFFS backup restore source contract

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/jffs-backup-restore-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned source references
        run: |
          set -euo pipefail
          mkdir -p work reports

          git init work/asus
          git -C work/asus remote add origin https://github.com/blackfuel/asuswrt-rt-ac86u.git
          git -C work/asus sparse-checkout init --cone
          git -C work/asus sparse-checkout set release/src/router/httpd release/src/router/shared release/src/router/nvram release/src/router/config_base
          git -C work/asus fetch --depth=1 --filter=blob:none origin a9179fc9329565dea0f7c5c7648fe8ad49ceaaf6
          git -C work/asus checkout --detach FETCH_HEAD

          git init work/merlin
          git -C work/merlin remote add origin https://github.com/RMerl/asuswrt-merlin.ng.git
          git -C work/merlin sparse-checkout init --cone
          git -C work/merlin sparse-checkout set release/src/router/httpd release/src/router/www
          git -C work/merlin fetch --depth=1 --filter=blob:none origin 6a5df61aab6f3fa2dffc518994d42e4f2a27fb2b
          git -C work/merlin checkout --detach FETCH_HEAD

      - name: Verify ASUS partial framework and donor restore semantics
        run: |
          set -euo pipefail
          A=work/asus
          M=work/merlin
          OUT=reports/jffs-backup-restore-source.txt
          : > "$OUT"

          pass() { echo "PASS $*" | tee -a "$OUT"; }
          fail() { echo "FAIL $*" | tee -a "$OUT"; return 1; }
          have() { grep -Fq "$2" "$1" && pass "$3" || fail "$3"; }

          echo '===== ASUS SAVEJFFS LINEAGE =====' | tee -a "$OUT"
          have "$A/release/src/router/config_base" '# RTCONFIG_SAVEJFFS is not set'             "Clean ASUS disables RTCONFIG_SAVEJFFS by default"
          have "$A/release/src/router/shared/shared.h" '#define JFFS_CFGS_HDR'             "Clean ASUS defines JFFS profile header"
          have "$A/release/src/router/shared/shared.h" 'append_jffs_cfgs'             "Clean ASUS declares append_jffs_cfgs"
          have "$A/release/src/router/shared/shared.h" 'restore_jffs_cfgs'             "Clean ASUS declares restore_jffs_cfgs"
          have "$A/release/src/router/httpd/web.c" 'append_jffs_cfgs(fp, "/tmp/settings")'             "Clean ASUS can append selected JFFS data to settings profile"
          have "$A/release/src/router/httpd/web.c" 'restore_jffs_cfgs("/tmp/settings_u.prf")'             "Clean ASUS settings upload can restore selected JFFS data"

          # The clean anchor intentionally saves a bounded list, not all /jffs.
          have "$A/release/src/router/httpd/web.c" 'char *lists[] = {'             "ASUS SAVEJFFS uses an explicit path list"
          have "$A/release/src/router/httpd/web.c" 'snprintf(cmd, sizeof(cmd), "tar czvf - -C /jffs")'             "ASUS SAVEJFFS archives selected JFFS content"
          have "$A/release/src/router/httpd/web.c" "Don't save huge data"             "ASUS SAVEJFFS documents RAM-size constraints"

          echo '===== MERLIN FULL-JFFS UI/BACKEND =====' | tee -a "$OUT"
          W="$M/release/src/router/www/Advanced_SettingBackup_Content.asp"
          H="$M/release/src/router/httpd/web.c"

          have "$W" "location.href='backup_jffs.tar'"             "Merlin UI exposes full JFFS backup"
          have "$W" 'document.form.action = "jffsupload.cgi"'             "Merlin UI posts restore archive to jffsupload.cgi"
          have "$H" '{ "backup_jffs.tar", "application/octet-stream"'             "Merlin registers authenticated backup endpoint"
          have "$H" '{ "jffsupload.cgi*", "text/html"'             "Merlin registers authenticated restore endpoint"
          have "$H" 'system("tar cf /tmp/backup_jffs.tar -C /jffs .")'             "Merlin backup archives the full JFFS tree"

          echo '===== DONOR RESTORE RISK MARKERS =====' | tee -a "$OUT"
          have "$H" 'if (f_size(JFFS_BACKUP_FILE) > 10)'             "Donor restore performs only a minimal size precheck"
          have "$H" 'system("rm -rf /jffs/*")'             "Donor deletes JFFS before archive validation"
          have "$H" 'system("/bin/tar -xf /tmp/backup_jffs.tar -C /jffs")'             "Donor extracts uploaded tar directly as root"
          if grep -Fq 'tar -tf' "$H" || grep -Fq 'realpath' "$H" || grep -Fq 'openat(' "$H"; then
            fail "Pinned donor unexpectedly gained archive path validation; re-review hardened adaptation"
          else
            pass "Pinned donor has no explicit archive traversal preflight in this path"
          fi

          echo 'CLASSIFICATION M10_M60_HARDENED_SOURCE_ADAPTATION_REQUIRED' | tee -a "$OUT"

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jffs-backup-restore-source
          path: reports/jffs-backup-restore-source.txt
          if-no-files-found: warn
          retention-days: 30
