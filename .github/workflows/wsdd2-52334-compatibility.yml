name: Probe Merlin wsdd2 on ASUS 52334

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/wsdd2-52334-compatibility.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction and ARM execution tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip qemu-user-static file binutils
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch and extract verified ASUS and Merlin images
        run: |
          set -euo pipefail
          mkdir -p work/asus work/merlin work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/asus.zip \
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/merlin.zip \
            'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/asus.zip' | sha256sum -c -
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/artifacts/merlin.zip' | sha256sum -c -
          unzip -q work/artifacts/asus.zip -d work/asus
          unzip -q work/artifacts/merlin.zip -d work/merlin
          for d in asus merlin; do
            (
              cd "work/$d"
              FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
              test -n "$FW"
              binwalk -Me "$FW" >/dev/null
            )
            ROOT="$(find "work/$d" -type d -name rootfs_ubifs -print -quit)"
            test -n "$ROOT"
            if [ "$d" = asus ]; then
              echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"
            else
              echo "MERLIN_ROOT=$ROOT" >> "$GITHUB_ENV"
            fi
          done

      - name: Probe wsdd2 binary, dependencies and lifecycle
        run: |
          set -euo pipefail
          A="$ASUS_ROOT"
          M="$MERLIN_ROOT"
          OUT=reports/wsdd2-52334-compatibility.txt
          : > "$OUT"

          echo '===== BINARY SURFACE =====' >> "$OUT"
          for side in ASUS MERLIN; do
            if [ "$side" = ASUS ]; then R="$A"; else R="$M"; fi
            P="$R/usr/sbin/wsdd2"
            if [ -e "$P" ]; then
              echo "$side present /usr/sbin/wsdd2 -> $(readlink "$P" || true)" >> "$OUT"
              file -L "$P" >> "$OUT" || true
              sha256sum "$(readlink -f "$P")" >> "$OUT" || true
            else
              echo "$side missing /usr/sbin/wsdd2" >> "$OUT"
            fi
          done

          WP="$M/usr/sbin/wsdd2"
          if [ ! -e "$WP" ]; then
            echo 'CLASSIFICATION=DONOR_BINARY_MISSING' >> "$OUT"
            cat "$OUT"
            exit 0
          fi
          WR="$(readlink -f "$WP")"

          echo '===== ELF NEEDED =====' >> "$OUT"
          readelf -d "$WR" | grep -E 'NEEDED|SONAME|RPATH|RUNPATH' >> "$OUT" || true
          readelf -V "$WR" | head -n 160 >> "$OUT" || true

          echo '===== DEPENDENCY MATCH AGAINST ASUS =====' >> "$OUT"
          missing=0
          while read -r lib; do
            [ -n "$lib" ] || continue
            hit="$(find "$A/lib" "$A/usr/lib" -maxdepth 2 \( -type f -o -type l \) -name "$lib" -print -quit 2>/dev/null || true)"
            if [ -n "$hit" ]; then
              echo "PASS $lib -> $hit -> $(readlink "$hit" || true)" >> "$OUT"
              file -L "$hit" >> "$OUT" || true
            else
              echo "MISSING $lib" >> "$OUT"
              missing=$((missing+1))
            fi
          done < <(readelf -d "$WR" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          echo "missing_needed=$missing" >> "$OUT"

          echo '===== ASUS-ROOT QEMU LOAD TEST =====' >> "$OUT"
          set +e
          qemu-arm-static -L "$A" "$WR" --help > reports/wsdd2-help.txt 2>&1
          help_rc=$?
          set -e
          echo "help_rc=$help_rc" >> "$OUT"
          head -n 120 reports/wsdd2-help.txt >> "$OUT" || true

          echo '===== LIFECYCLE SURFACE =====' >> "$OUT"
          for side in ASUS MERLIN; do
            if [ "$side" = ASUS ]; then R="$A"; else R="$M"; fi
            echo "--- $side ---" >> "$OUT"
            for rel in sbin/rc usr/sbin/httpd usr/lib/libshared.so; do
              [ -f "$R/$rel" ] || continue
              if strings -a "$R/$rel" | grep -Fq 'wsdd2'; then
                echo "PASS $rel::wsdd2" >> "$OUT"
                strings -a "$R/$rel" | grep -Ei 'wsdd2|samba|smbd|nmbd' | sort -u | head -n 100 >> "$OUT" || true
              else
                echo "MISSING $rel::wsdd2" >> "$OUT"
              fi
            done
          done

          asus_rc_wsdd=no
          merlin_rc_wsdd=no
          strings -a "$A/sbin/rc" | grep -Fq 'wsdd2' && asus_rc_wsdd=yes || true
          strings -a "$M/sbin/rc" | grep -Fq 'wsdd2' && merlin_rc_wsdd=yes || true

          echo '===== CLASSIFICATION =====' >> "$OUT"
          echo "dependency_missing=$missing" >> "$OUT"
          echo "asus_rc_wsdd2=$asus_rc_wsdd" >> "$OUT"
          echo "merlin_rc_wsdd2=$merlin_rc_wsdd" >> "$OUT"
          if [ "$missing" -eq 0 ] && [ "$help_rc" -ne 126 ] && [ "$help_rc" -ne 127 ]; then
            echo 'BINARY_COMPAT=PASS' >> "$OUT"
          else
            echo 'BINARY_COMPAT=FAIL' >> "$OUT"
          fi
          if [ "$missing" -eq 0 ] && [ "$asus_rc_wsdd" = no ] && [ "$merlin_rc_wsdd" = yes ]; then
            echo 'PORT_CLASS=LIFECYCLE_SOURCE_HOOK_REQUIRED' >> "$OUT"
          fi

          cat "$OUT"

      - name: Stage dormant verified wsdd2 in guarded overlay
        run: |
          set -euo pipefail
          BIN="$(readlink -f "$MERLIN_ROOT/usr/sbin/wsdd2")"
          EXPECTED=89a4309ccbe6a33c74ac2ea971c91af1e753ca930c26767259594172189b94e0

          test -f "$BIN"
          test "$(sha256sum "$BIN" | awk '{print $1}')" = "$EXPECTED"
          file "$BIN" | grep -Eq 'ELF 32-bit.*ARM'
          readelf -d "$BIN" | grep -Fq 'Shared library: [libc.so.6]'
          readelf -d "$BIN" | grep -Fq 'Shared library: [ld-linux.so.3]'

          # This workflow is long-running; another verified port may update
          # ports/active.json while firmware extraction is in progress.
          # Rebase the workspace to current branch head before creating the
          # staging commit so manifest additions are composed, not conflicted.
          git fetch origin asus-52334-merlin-port
          git reset --hard origin/asus-52334-merlin-port

          mkdir -p ports/files/usr/sbin
          cp "$BIN" ports/files/usr/sbin/wsdd2
          chmod 0755 ports/files/usr/sbin/wsdd2

          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("ports/active.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          expected={
              "type":"copy",
              "source_kind":"repo",
              "source":"ports/files/usr/sbin/wsdd2",
              "target":"/usr/sbin/wsdd2",
              "sha256":"89a4309ccbe6a33c74ac2ea971c91af1e753ca930c26767259594172189b94e0",
              "mode":"0755",
              "policy":"add_only",
          }
          matches=[e for e in d["entries"] if e.get("target")=="/usr/sbin/wsdd2"]
          if not matches:
              d["entries"].append(expected)
          elif len(matches)!=1 or matches[0]!=expected:
              raise SystemExit(f"existing wsdd2 manifest entry differs: {matches!r}")
          p.write_text(json.dumps(d,indent=2)+"\n",encoding="utf-8")
          PY

          python3 tools/check_port_overlay.py ports/active.json
          test "$(sha256sum ports/files/usr/sbin/wsdd2 | awk '{print $1}')" = "$EXPECTED"

          if git diff --quiet -- ports/files/usr/sbin/wsdd2 ports/active.json &&
             git ls-files --error-unmatch ports/files/usr/sbin/wsdd2 >/dev/null 2>&1; then
            echo 'Verified dormant wsdd2 already staged'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ports/files/usr/sbin/wsdd2 ports/active.json
          git commit -m 'port: stage verified dormant wsdd2'
          git pull --rebase origin asus-52334-merlin-port
          git push origin HEAD:asus-52334-merlin-port

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsdd2-52334-compatibility
          path: |
            reports/wsdd2-52334-compatibility.txt
            reports/wsdd2-help.txt
          if-no-files-found: warn
          retention-days: 14
