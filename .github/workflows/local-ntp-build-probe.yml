name: Build isolated ASUS-lineage NTPD candidate

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/local-ntp-build-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross-build and smoke-test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user-static file make bc bzip2

      - name: Fetch pinned clean ASUS BusyBox source
        run: |
          set -euo pipefail
          mkdir -p work reports artifacts
          git init work/asus
          git -C work/asus remote add origin https://github.com/blackfuel/asuswrt-rt-ac86u.git
          git -C work/asus sparse-checkout init --cone
          git -C work/asus sparse-checkout set release/src/router/busybox
          git -C work/asus fetch --depth=1 --filter=blob:none origin a9179fc9329565dea0f7c5c7648fe8ad49ceaaf6
          git -C work/asus checkout --detach FETCH_HEAD
          git -C work/asus show -s --format='%H %s' HEAD | tee reports/local-ntp-build.txt

      - name: Configure minimal static ntpd-only BusyBox
        run: |
          set -euo pipefail
          B=work/asus/release/src/router/busybox
          OUT="$GITHUB_WORKSPACE/reports/local-ntp-build.txt"

          cd "$B"
          make distclean
          make allnoconfig CROSS_COMPILE=aarch64-linux-gnu-

          set_cfg() {
            key="$1"
            val="$2"
            if grep -q "^# $key is not set$" .config; then
              sed -i "s/^# $key is not set$/$key=$val/" .config
            elif grep -q "^$key=" .config; then
              sed -i "s#^$key=.*#$key=$val#" .config
            else
              printf '%s=%s\n' "$key" "$val" >> .config
            fi
          }

          set_cfg CONFIG_STATIC y
          set_cfg CONFIG_CROSS_COMPILER_PREFIX '"aarch64-linux-gnu-"'
          set_cfg CONFIG_NTPD y
          set_cfg CONFIG_FEATURE_NTPD_SERVER y
          set_cfg CONFIG_FEATURE_NTPD_CONF y
          set_cfg CONFIG_FEATURE_IPV6 y
          set_cfg CONFIG_LONG_OPTS y
          set_cfg CONFIG_SHOW_USAGE y
          set_cfg CONFIG_FEATURE_PIDFILE y

          set +e
          set +o pipefail
          yes "" | make oldconfig CROSS_COMPILE=aarch64-linux-gnu- >/dev/null
          oldconfig_rc=$?
          set -o pipefail
          set -e
          if [ "$oldconfig_rc" -ne 0 ]; then
            echo "FAIL oldconfig rc=$oldconfig_rc" | tee -a "$OUT"
            exit "$oldconfig_rc"
          fi

          # Old BusyBox bakes the current time into AUTOCONF_TIMESTAMP/BB_BT.
          # Normalize it so clean rebuilds test source/config reproducibility,
          # not wall-clock time.
          sed -i 's/^#define AUTOCONF_TIMESTAMP .*/#define AUTOCONF_TIMESTAMP "1970-01-01 00:00:00 UTC"/' include/autoconf.h
          grep -Fx '#define AUTOCONF_TIMESTAMP "1970-01-01 00:00:00 UTC"' include/autoconf.h

          echo '===== FINAL CONFIG =====' | tee -a "$OUT"
          grep -E '^(CONFIG_STATIC|CONFIG_NTPD|CONFIG_FEATURE_NTPD_SERVER|CONFIG_FEATURE_NTPD_CONF|CONFIG_FEATURE_IPV6|CONFIG_LONG_OPTS|CONFIG_CROSS_COMPILER_PREFIX)=' .config \
            | tee -a "$OUT"

      - name: Build AArch64 static candidate
        run: |
          set -euo pipefail
          B=work/asus/release/src/router/busybox
          OUT=reports/local-ntp-build.txt

          set +e
          make -C "$B" -j2 CROSS_COMPILE=aarch64-linux-gnu- V=1 > reports/local-ntp-build.log 2>&1
          build_rc=$?
          set -e
          if [ "$build_rc" -ne 0 ]; then
            echo "===== BUILD FAILURE rc=$build_rc =====" | tee -a "$OUT"
            tail -n 240 reports/local-ntp-build.log | tee -a "$OUT"
            exit "$build_rc"
          fi

          cp "$B/busybox" artifacts/rtac86u-ntpd-static
          chmod 0755 artifacts/rtac86u-ntpd-static
          strings -a artifacts/rtac86u-ntpd-static > reports/local-ntp-strings-first.txt
          find "$B" -type f -name '*.o' -print0 | sort -z | xargs -0 sha256sum \
            | sed "s#$B/##" > reports/local-ntp-objects-first.sha256
          for g in include/usage_compressed.h include/applet_tables.h include/applets.h include/usage.h include/autoconf.h; do
            [ -f "$B/$g" ] && sha256sum "$B/$g" | sed "s#$B/##" >> reports/local-ntp-generated-first.sha256
          done

          echo '===== ELF =====' | tee -a "$OUT"
          file artifacts/rtac86u-ntpd-static | tee -a "$OUT"
          aarch64-linux-gnu-readelf -h artifacts/rtac86u-ntpd-static | tee -a "$OUT"
          aarch64-linux-gnu-readelf -l artifacts/rtac86u-ntpd-static | tee -a "$OUT"

          file artifacts/rtac86u-ntpd-static | grep -Eq 'ELF 64-bit.*ARM aarch64|ELF 64-bit.*AArch64'
          if aarch64-linux-gnu-readelf -l artifacts/rtac86u-ntpd-static | grep -q 'INTERP'; then
            echo 'FAIL candidate has dynamic interpreter' | tee -a "$OUT"
            exit 1
          fi
          echo 'PASS candidate is static AArch64 with no PT_INTERP' | tee -a "$OUT"

          sha256sum artifacts/rtac86u-ntpd-static | tee -a "$OUT"
          stat -c 'size=%s mode=%a' artifacts/rtac86u-ntpd-static | tee -a "$OUT"

      - name: QEMU single-applet and option smoke test
        run: |
          set -euo pipefail
          BIN=artifacts/rtac86u-ntpd-static
          OUT=reports/local-ntp-build.txt
          B=work/asus/release/src/router/busybox

          echo '===== SINGLE APPLET CONFIG =====' | tee -a "$OUT"
          grep -Fxq 'CONFIG_NTPD=y' "$B/.config"
          grep -E '^CONFIG_[A-Z0-9_]+=y$' "$B/.config" > reports/local-ntp-applets.txt
          echo 'PASS NTPD is enabled in an allnoconfig-derived build' | tee -a "$OUT"

          echo '===== NTPD HELP =====' | tee -a "$OUT"
          set +e
          sudo qemu-aarch64-static "$BIN" --help > reports/local-ntp-help.txt 2>&1
          help_rc=$?
          set -e
          cat reports/local-ntp-help.txt | tee -a "$OUT"
          echo "help_rc=$help_rc" | tee -a "$OUT"

          grep -Eiq 'Usage: ntpd|NTP client/server' reports/local-ntp-help.txt
          grep -Fq -- '[-dnqNwtl -I IFACE]' reports/local-ntp-help.txt
          grep -Fq -- '[-p PEER]' reports/local-ntp-help.txt
          echo 'PASS runtime usage exposes w/t/l/I and peer option surface' | tee -a "$OUT"

          grep -Fq '"wp:S:t"' "$B/networking/ntpd.c"
          grep -Fq 'IF_FEATURE_NTPD_SERVER("I:")' "$B/networking/ntpd.c"
          grep -Fq 'OPT_t' "$B/networking/ntpd.c"
          echo 'PASS source getopt contract includes -w/-p/-S/-t/-l/-I' | tee -a "$OUT"

      - name: Root launch smoke on UDP 123
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/artifacts/rtac86u-ntpd-static"
          OUT="$GITHUB_WORKSPACE/reports/local-ntp-build.txt"

          echo '===== ROOT LAUNCH SMOKE =====' | tee -a "$OUT"
          set +e
          sudo timeout --signal=TERM 3 \
            qemu-aarch64-static "$BIN" -w -l -I lo -p 192.0.2.1 \
            > reports/local-ntp-run.out 2> reports/local-ntp-run.err
          rc=$?
          set -e

          cat reports/local-ntp-run.out | tee -a "$OUT" || true
          cat reports/local-ntp-run.err | tee -a "$OUT" || true
          echo "run_rc=$rc" | tee -a "$OUT"

          if [ "$rc" -eq 124 ]; then
            echo 'PASS ntpd stayed alive until timeout' | tee -a "$OUT"
          else
            echo 'FAIL ntpd exited before timeout' | tee -a "$OUT"
            exit 1
          fi

          echo 'CLASSIFICATION STATIC_ASUS_LINEAGE_NTPD_BUILD_CANDIDATE' | tee -a "$OUT"

      - name: Rebuild reproducibility check
        run: |
          set -euo pipefail
          B=work/asus/release/src/router/busybox
          OUT=reports/local-ntp-build.txt

          cp "$B/.config" reports/local-ntp-config
          first_hash="$(sha256sum artifacts/rtac86u-ntpd-static | awk '{print $1}')"

          make -C "$B" distclean
          cp reports/local-ntp-config "$B/.config"

          set +e
          set +o pipefail
          yes "" | make -C "$B" oldconfig CROSS_COMPILE=aarch64-linux-gnu- >/dev/null
          oldconfig_rc=$?
          set -o pipefail
          set -e
          [ "$oldconfig_rc" -eq 0 ]

          sed -i 's/^#define AUTOCONF_TIMESTAMP .*/#define AUTOCONF_TIMESTAMP "1970-01-01 00:00:00 UTC"/' "$B/include/autoconf.h"
          grep -Fx '#define AUTOCONF_TIMESTAMP "1970-01-01 00:00:00 UTC"' "$B/include/autoconf.h"

          make -C "$B" -j2 CROSS_COMPILE=aarch64-linux-gnu- V=1 > reports/local-ntp-rebuild.log 2>&1
          cp "$B/busybox" artifacts/rtac86u-ntpd-static-rebuild
          chmod 0755 artifacts/rtac86u-ntpd-static-rebuild
          strings -a artifacts/rtac86u-ntpd-static-rebuild > reports/local-ntp-strings-second.txt
          find "$B" -type f -name '*.o' -print0 | sort -z | xargs -0 sha256sum \
            | sed "s#$B/##" > reports/local-ntp-objects-second.sha256
          for g in include/usage_compressed.h include/applet_tables.h include/applets.h include/usage.h include/autoconf.h; do
            [ -f "$B/$g" ] && sha256sum "$B/$g" | sed "s#$B/##" >> reports/local-ntp-generated-second.sha256
          done

          second_hash="$(sha256sum artifacts/rtac86u-ntpd-static-rebuild | awk '{print $1}')"
          echo "first_hash=$first_hash" | tee -a "$OUT"
          echo "second_hash=$second_hash" | tee -a "$OUT"

          if cmp -s artifacts/rtac86u-ntpd-static artifacts/rtac86u-ntpd-static-rebuild; then
            echo 'PASS clean rebuild is byte-identical' | tee -a "$OUT"
          else
            echo 'FAIL clean rebuild differs' | tee -a "$OUT"
            cmp -l artifacts/rtac86u-ntpd-static artifacts/rtac86u-ntpd-static-rebuild \
              | head -n 100 | tee reports/local-ntp-binary-diff.txt | tee -a "$OUT" || true

            echo '===== BUILD-ID / SECTION DIAGNOSTIC =====' | tee -a "$OUT"
            aarch64-linux-gnu-readelf -n artifacts/rtac86u-ntpd-static | tee reports/local-ntp-notes-first.txt | tee -a "$OUT"
            aarch64-linux-gnu-readelf -n artifacts/rtac86u-ntpd-static-rebuild | tee reports/local-ntp-notes-second.txt | tee -a "$OUT"

            cp artifacts/rtac86u-ntpd-static reports/ntpd-no-buildid-first
            cp artifacts/rtac86u-ntpd-static-rebuild reports/ntpd-no-buildid-second
            aarch64-linux-gnu-objcopy --remove-section .note.gnu.build-id reports/ntpd-no-buildid-first
            aarch64-linux-gnu-objcopy --remove-section .note.gnu.build-id reports/ntpd-no-buildid-second

            if cmp -s reports/ntpd-no-buildid-first reports/ntpd-no-buildid-second; then
              echo 'DIAG difference is limited to .note.gnu.build-id' | tee -a "$OUT"
            else
              echo 'DIAG differences remain after removing .note.gnu.build-id' | tee -a "$OUT"
              echo '===== OBJECT HASH DIFF =====' | tee -a "$OUT"
              diff -u reports/local-ntp-objects-first.sha256 reports/local-ntp-objects-second.sha256 \
                | tee reports/local-ntp-object-hash-diff.txt | tee -a "$OUT" || true
              echo '===== GENERATED HEADER HASH DIFF =====' | tee -a "$OUT"
              diff -u reports/local-ntp-generated-first.sha256 reports/local-ntp-generated-second.sha256 \
                | tee reports/local-ntp-generated-hash-diff.txt | tee -a "$OUT" || true
              echo '===== PRINTABLE STRING DIFF =====' | tee -a "$OUT"
              diff -u reports/local-ntp-strings-first.txt reports/local-ntp-strings-second.txt \
                | head -n 160 | tee reports/local-ntp-strings-diff.txt | tee -a "$OUT" || true

              for sec in .text .rodata .data .data.rel.ro .got .got.plt; do
                h1="$(aarch64-linux-gnu-objcopy -O binary --only-section="$sec" artifacts/rtac86u-ntpd-static /dev/stdout 2>/dev/null | sha256sum | awk '{print $1}' || true)"
                h2="$(aarch64-linux-gnu-objcopy -O binary --only-section="$sec" artifacts/rtac86u-ntpd-static-rebuild /dev/stdout 2>/dev/null | sha256sum | awk '{print $1}' || true)"
                echo "SECTION $sec first=$h1 second=$h2" | tee -a "$OUT"
              done
            fi
            exit 1
          fi

      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ntp-build-probe
          path: |
            artifacts/rtac86u-ntpd-static
            artifacts/rtac86u-ntpd-static-rebuild
            reports/local-ntp-build.txt
            reports/local-ntp-config
            reports/local-ntp-rebuild.log
            reports/local-ntp-binary-diff.txt
            reports/local-ntp-notes-first.txt
            reports/local-ntp-notes-second.txt
            reports/local-ntp-strings-first.txt
            reports/local-ntp-strings-second.txt
            reports/local-ntp-strings-diff.txt
            reports/local-ntp-objects-first.sha256
            reports/local-ntp-objects-second.sha256
            reports/local-ntp-object-hash-diff.txt
            reports/local-ntp-generated-first.sha256
            reports/local-ntp-generated-second.sha256
            reports/local-ntp-generated-hash-diff.txt
            reports/local-ntp-build.log
            reports/local-ntp-applets.txt
            reports/local-ntp-help.txt
            reports/local-ntp-run.out
            reports/local-ntp-run.err
          if-no-files-found: warn
          retention-days: 30
