name: Build isolated ASUS-lineage NTPD candidate

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/local-ntp-build-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross-build and smoke-test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross             qemu-user-static file make bc bzip2

      - name: Fetch pinned clean ASUS BusyBox source
        run: |
          set -euo pipefail
          mkdir -p work reports artifacts
          git init work/asus
          git -C work/asus remote add origin https://github.com/blackfuel/asuswrt-rt-ac86u.git
          git -C work/asus sparse-checkout init --cone
          git -C work/asus sparse-checkout set release/src/router/busybox
          git -C work/asus fetch --depth=1 --filter=blob:none origin a9179fc9329565dea0f7c5c7648fe8ad49ceaaf6
          git -C work/asus checkout --detach FETCH_HEAD
          git -C work/asus show -s --format='%H %s' HEAD | tee reports/local-ntp-build.txt

      - name: Configure minimal static ntpd-only BusyBox
        run: |
          set -euo pipefail
          B=work/asus/release/src/router/busybox
          OUT=reports/local-ntp-build.txt

          cd "$B"
          make distclean
          make allnoconfig CROSS_COMPILE=aarch64-linux-gnu-

          set_cfg() {
            key="$1"
            val="$2"
            if grep -q "^# ${key} is not set$" .config; then
              sed -i "s/^# ${key} is not set$/${key}=${val}/" .config
            elif grep -q "^${key}=" .config; then
              sed -i "s#^${key}=.*#${key}=${val}#" .config
            else
              printf '%s=%s\n' "$key" "$val" >> .config
            fi
          }

          set_cfg CONFIG_STATIC y
          set_cfg CONFIG_CROSS_COMPILER_PREFIX '"aarch64-linux-gnu-"'
          set_cfg CONFIG_NTPD y
          set_cfg CONFIG_FEATURE_NTPD_SERVER y
          set_cfg CONFIG_FEATURE_NTPD_CONF y
          set_cfg CONFIG_FEATURE_IPV6 y
          set_cfg CONFIG_LONG_OPTS y
          set_cfg CONFIG_SHOW_USAGE y
          set_cfg CONFIG_FEATURE_PIDFILE y

          set +e
          yes "" | make oldconfig CROSS_COMPILE=aarch64-linux-gnu- >/dev/null
          oldconfig_rc=${PIPESTATUS[1]}
          set -e
          [ "$oldconfig_rc" -eq 0 ] || {
            echo "FAIL oldconfig rc=$oldconfig_rc" | tee -a "$GITHUB_WORKSPACE/$OUT"
            exit "$oldconfig_rc"
          }

          echo '===== FINAL CONFIG =====' | tee -a "$GITHUB_WORKSPACE/$OUT"
          grep -E '^(CONFIG_STATIC|CONFIG_NTPD|CONFIG_FEATURE_NTPD_SERVER|CONFIG_FEATURE_NTPD_CONF|CONFIG_FEATURE_IPV6|CONFIG_LONG_OPTS|CONFIG_CROSS_COMPILER_PREFIX)=' .config             | tee -a "$GITHUB_WORKSPACE/$OUT"

      - name: Build candidate
        run: |
          set -euo pipefail
          B=work/asus/release/src/router/busybox
          OUT=reports/local-ntp-build.txt

          set +e
          make -C "$B" -j2 CROSS_COMPILE=aarch64-linux-gnu- V=1 > reports/local-ntp-build.log 2>&1
          build_rc=$?
          set -e
          if [ "$build_rc" -ne 0 ]; then
            echo "===== BUILD FAILURE rc=$build_rc =====" | tee -a "$OUT"
            tail -n 240 reports/local-ntp-build.log | tee -a "$OUT"
            exit "$build_rc"
          fi

          cp "$B/busybox" artifacts/rtac86u-ntpd-static
          chmod 0755 artifacts/rtac86u-ntpd-static

          echo '===== ELF =====' | tee -a "$OUT"
          file artifacts/rtac86u-ntpd-static | tee -a "$OUT"
          aarch64-linux-gnu-readelf -h artifacts/rtac86u-ntpd-static | tee -a "$OUT"
          aarch64-linux-gnu-readelf -l artifacts/rtac86u-ntpd-static | tee -a "$OUT"

          file artifacts/rtac86u-ntpd-static | grep -Eq 'ELF 64-bit.*ARM aarch64|ELF 64-bit.*AArch64'
          if aarch64-linux-gnu-readelf -l artifacts/rtac86u-ntpd-static | grep -q 'INTERP'; then
            echo 'FAIL candidate has dynamic interpreter' | tee -a "$OUT"
            exit 1
          else
            echo 'PASS candidate is static/no PT_INTERP' | tee -a "$OUT"
          fi

          sha256sum artifacts/rtac86u-ntpd-static | tee -a "$OUT"
          stat -c 'size=%s mode=%a' artifacts/rtac86u-ntpd-static | tee -a "$OUT"

      - name: QEMU single-applet and option smoke test
        run: |
          set -euo pipefail
          BIN=artifacts/rtac86u-ntpd-static
          OUT=reports/local-ntp-build.txt

          echo '===== SINGLE APPLET CONFIG =====' | tee -a "$OUT"
          B=work/asus/release/src/router/busybox
          grep -Fxq 'CONFIG_NTPD=y' "$B/.config"
          enabled_applets="$(grep -E '^CONFIG_[A-Z0-9_]+=y
      - name: Root launch smoke on UDP 123
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/artifacts/rtac86u-ntpd-static"
          OUT="$GITHUB_WORKSPACE/reports/local-ntp-build.txt"

          echo '===== ROOT LAUNCH SMOKE =====' | tee -a "$OUT"
          set +e
          sudo timeout --signal=TERM 3             qemu-aarch64-static "$BIN" -w -l -I lo -p 192.0.2.1             > reports/local-ntp-run.out 2> reports/local-ntp-run.err
          rc=$?
          set -e

          cat reports/local-ntp-run.out | tee -a "$OUT" || true
          cat reports/local-ntp-run.err | tee -a "$OUT" || true
          echo "run_rc=$rc" | tee -a "$OUT"

          if [ "$rc" -eq 124 ]; then
            echo 'PASS ntpd stayed alive until timeout' | tee -a "$OUT"
          else
            echo 'FAIL ntpd exited before timeout' | tee -a "$OUT"
            exit 1
          fi

          echo 'CLASSIFICATION STATIC_ASUS_LINEAGE_NTPD_BUILD_CANDIDATE' | tee -a "$OUT"

      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ntp-build-probe
          path: |
            artifacts/rtac86u-ntpd-static
            reports/local-ntp-build.txt
            reports/local-ntp-build.log
            reports/local-ntp-applets.txt
            reports/local-ntp-help.txt
            reports/local-ntp-run.out
            reports/local-ntp-run.err
          if-no-files-found: warn
          retention-days: 30
 "$B/.config" | grep -Ev '^CONFIG_(NTPD|FEATURE_NTPD_|STATIC|CROSS_COMPILER_PREFIX|FEATURE_IPV6|LONG_OPTS|SHOW_USAGE|FEATURE_PIDFILE)' || true)"
          echo 'PASS ntpd is the only intentionally enabled functional applet' | tee -a "$OUT"
          printf '%s\n' "$enabled_applets" > reports/local-ntp-applets.txt

          echo '===== NTPD HELP =====' | tee -a "$OUT"
          set +e
          sudo qemu-aarch64-static "$BIN" --help > reports/local-ntp-help.txt 2>&1
          help_rc=$?
          set -e
          cat reports/local-ntp-help.txt | tee -a "$OUT"
          echo "help_rc=$help_rc" | tee -a "$OUT"

          for opt in '-w' '-l' '-I' '-p'; do
            grep -Fq -- "$opt" reports/local-ntp-help.txt               && echo "PASS help contains $opt" | tee -a "$OUT"               || { echo "FAIL help missing $opt" | tee -a "$OUT"; exit 1; }
          done

          # ASUS-lineage ntpd.c carries trust-mode support; verify compiled surface.
          if grep -Fq -- '-t' reports/local-ntp-help.txt || strings "$BIN" | grep -Fqi 'trust'; then
            echo 'PASS trust-mode surface present' | tee -a "$OUT"
          else
            echo 'FAIL trust-mode surface missing' | tee -a "$OUT"
            exit 1
          fi

      - name: Root launch smoke on UDP 123
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/artifacts/rtac86u-ntpd-static"
          OUT="$GITHUB_WORKSPACE/reports/local-ntp-build.txt"

          echo '===== ROOT LAUNCH SMOKE =====' | tee -a "$OUT"
          set +e
          sudo timeout --signal=TERM 3             qemu-aarch64-static "$BIN" ntpd -w -l -I lo -p 192.0.2.1             > reports/local-ntp-run.out 2> reports/local-ntp-run.err
          rc=$?
          set -e

          cat reports/local-ntp-run.out | tee -a "$OUT" || true
          cat reports/local-ntp-run.err | tee -a "$OUT" || true
          echo "run_rc=$rc" | tee -a "$OUT"

          if [ "$rc" -eq 124 ]; then
            echo 'PASS ntpd stayed alive until timeout' | tee -a "$OUT"
          else
            echo 'FAIL ntpd exited before timeout' | tee -a "$OUT"
            exit 1
          fi

          echo 'CLASSIFICATION STATIC_ASUS_LINEAGE_NTPD_BUILD_CANDIDATE' | tee -a "$OUT"

      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ntp-build-probe
          path: |
            artifacts/rtac86u-ntpd-static
            reports/local-ntp-build.txt
            reports/local-ntp-build.log
            reports/local-ntp-applets.txt
            reports/local-ntp-help.txt
            reports/local-ntp-run.out
            reports/local-ntp-run.err
          if-no-files-found: warn
          retention-days: 30
