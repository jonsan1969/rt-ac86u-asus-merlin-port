name: Probe QoS and firewall refinements on ASUS 52334

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/qos-firewall-refinements-52334.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch and extract verified images
        run: |
          set -euo pipefail
          mkdir -p work/asus work/merlin work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/asus.zip \
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/merlin.zip \
            'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/asus.zip' | sha256sum -c -
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/artifacts/merlin.zip' | sha256sum -c -
          unzip -q work/artifacts/asus.zip -d work/asus
          unzip -q work/artifacts/merlin.zip -d work/merlin
          for d in asus merlin; do
            (
              cd "work/$d"
              FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
              test -n "$FW"
              binwalk -Me "$FW" >/dev/null
            )
            ROOT="$(find "work/$d" -type d -name rootfs_ubifs -print -quit)"
            test -n "$ROOT"
            if [ "$d" = asus ]; then echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"; else echo "MERLIN_ROOT=$ROOT" >> "$GITHUB_ENV"; fi
          done

      - name: Probe exact refinement surfaces
        run: |
          set -euo pipefail
          A="$ASUS_ROOT"; M="$MERLIN_ROOT"; OUT=reports/qos-firewall-refinements-52334.txt
          : > "$OUT"

          echo '===== M61/M62 QOS CLASSIFICATION PAGE =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            P="$R/www/QoS_Stats.asp"
            echo "--- $side ---" >> "$OUT"
            if [ -f "$P" ]; then
              echo "page=yes sha256=$(sha256sum "$P" | cut -d' ' -f1)" >> "$OUT"
              grep -nEi 'ipv6|tracked connections|check_bwdpi_engine_status|bwdpi_conntrack|clientlist' "$P" | head -n 160 >> "$OUT" || true
            else
              echo 'page=no' >> "$OUT"
            fi
            for sig in get_bwdpi_conntrack bw_cte_dump ej_gettcdata ajax_gettcdata; do
              hits=''
              for rel in usr/sbin/httpd sbin/rc; do
                strings -a "$R/$rel" | grep -Fq "$sig" && hits="$hits $rel" || true
              done
              echo "$sig:${hits:- MISSING}" >> "$OUT"
            done
          done

          echo '===== M63 TRADITIONAL QOS IPV6 =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            for sig in mangle_rules_ipv6 ip6tables-restore QOSO ipv6_enabled; do
              if strings -a "$R/sbin/rc" | grep -Fq "$sig"; then echo "PASS rc::$sig" >> "$OUT"; else echo "MISSING rc::$sig" >> "$OUT"; fi
            done
            for p in "$R"/www/*QoS* "$R"/www/*qos*; do
              [ -f "$p" ] || continue
              hits="$(grep -Ein 'IPv6|qos_overhead|qos_atm' "$p" | head -n 80 || true)"
              [ -n "$hits" ] && { echo "--- ${p#"$R/"} ---" >> "$OUT"; printf '%s\n' "$hits" >> "$OUT"; }
            done
          done

          echo '===== M64 TQOS OVERHEAD AND DOWNLOAD STATS =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            for sig in qos_overhead qos_atm 'overhead %d %s' 'tc -s class show dev br0' 'qos_ibw' 'qos_obw'; do
              if strings -a "$R/sbin/rc" | grep -Fq "$sig"; then echo "PASS rc::$sig" >> "$OUT"; else echo "MISSING rc::$sig" >> "$OUT"; fi
              if strings -a "$R/usr/sbin/httpd" | grep -Fq "$sig"; then echo "PASS httpd::$sig" >> "$OUT"; fi
            done
          done

          echo '===== M68 ALLOWED OUTBOUND LAN LOGGING =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            for sig in fw_log_x logaccept '-A FORWARD -i %s -j %s' 'ACCEPT '; do
              if strings -a "$R/sbin/rc" | grep -Fq -- "$sig"; then echo "PASS rc::$sig" >> "$OUT"; else echo "MISSING rc::$sig" >> "$OUT"; fi
            done
            strings -a "$R/sbin/rc" | grep -F -- '-A FORWARD -i %s -j %s' | head -n 20 >> "$OUT" || true
          done

          echo '===== SAFE CLASSIFICATION HINTS =====' >> "$OUT"
          [ -f "$A/www/QoS_Stats.asp" ] || echo 'M61_M62=DEPEND_ON_M46_HTTPD_CLASSIFICATION_SOURCE_PATH' >> "$OUT"
          cat "$OUT"

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: qos-firewall-refinements-52334
          path: reports/qos-firewall-refinements-52334.txt
          if-no-files-found: error
          retention-days: 14
