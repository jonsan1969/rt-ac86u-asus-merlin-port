name: Probe ASUS 52334 cru scheduler compatibility

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/cru-52334-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction and ARM execution tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip qemu-user-static binfmt-support file binutils
          sudo update-binfmts --enable qemu-arm || true
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch verified ASUS and Merlin images
        run: |
          set -euo pipefail
          mkdir -p work/asus work/merlin work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/asus.zip             'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/merlin.zip             'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/asus.zip' | sha256sum -c -
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/artifacts/merlin.zip' | sha256sum -c -
          unzip -q work/artifacts/asus.zip -d work/asus
          unzip -q work/artifacts/merlin.zip -d work/merlin
          for d in asus merlin; do
            (
              cd "work/$d"
              FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
              test -n "$FW"
              binwalk -Me "$FW" >/dev/null
            )
            ROOT="$(find "work/$d" -type d -name rootfs_ubifs -print -quit)"
            test -n "$ROOT"
            if [ "$d" = asus ]; then echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"; else echo "MERLIN_ROOT=$ROOT" >> "$GITHUB_ENV"; fi
          done
      - name: Compare cru runtime
        run: |
          set -euo pipefail
          OUT=reports/cru-52334-compatibility.txt
          : > "$OUT"
          for side in ASUS MERLIN; do
            if [ "$side" = ASUS ]; then R="$ASUS_ROOT"; else R="$MERLIN_ROOT"; fi
            P="$R/usr/sbin/cru"
            echo "===== $side cru =====" >> "$OUT"
            if [ ! -f "$P" ]; then echo MISSING >> "$OUT"; continue; fi
            file "$P" >> "$OUT"
            sha256sum "$P" >> "$OUT"
            stat -c 'size=%s mode=%a' "$P" >> "$OUT"
            strings -a "$P" | grep -Ei 'usage|add|delete|list|cron|lock|tmp|pid|already|collision|name|/var/spool' | sort -u >> "$OUT" || true
            qemu-arm-static -L "$R" "$P" 2>&1 | head -n 80 >> "$OUT" || true
            echo '-- full script --' >> "$OUT"
            cat "$P" >> "$OUT"
            echo >> "$OUT"
          done

          echo '===== SOURCE PROVENANCE HINT =====' >> "$OUT"
          cmp -s "$ASUS_ROOT/usr/sbin/cru" "$MERLIN_ROOT/usr/sbin/cru" &&
            echo 'ASUS_MERLIN_BYTE_IDENTICAL=yes' >> "$OUT" ||
            echo 'ASUS_MERLIN_BYTE_IDENTICAL=no' >> "$OUT"

          echo '===== ASUS FLOCK SURFACE =====' >> "$OUT"
          FP="$(find "$ASUS_ROOT/bin" "$ASUS_ROOT/sbin" "$ASUS_ROOT/usr/bin" "$ASUS_ROOT/usr/sbin" -maxdepth 1 \( -type f -o -type l \) -name flock -print -quit 2>/dev/null || true)"
          if [ -n "$FP" ]; then
            echo "flock_path=$FP target=$(readlink "$FP" || true)" >> "$OUT"
            ls -l "$FP" >> "$OUT"
            file -L "$FP" >> "$OUT" || true
            # Direct qemu-user invocation is not trustworthy for this ASUS
            # BusyBox (even known applets return rc=1), so execute the exact
            # firmware process model under binfmt/chroot instead: ASUS /bin/sh
            # opens fd 278, ASUS /usr/bin/flock locks that inherited fd, a
            # second open must contend, then the lock must release on close.
            echo '-- static flock evidence --' >> "$OUT"
            strings -a "$ASUS_ROOT/bin/busybox" | grep -Ei '^flock$|flock' | head -n 20 >> "$OUT" || true

            set +e
            sudo chroot "$ASUS_ROOT" /bin/busybox true > reports/chroot-sanity.txt 2>&1
            sanity_rc=$?
            set -e
            echo "chroot_busybox_true_rc=$sanity_rc" >> "$OUT"
            cat reports/chroot-sanity.txt >> "$OUT" || true

            if [ "$sanity_rc" -eq 0 ]; then
              set +e
              sudo chroot "$ASUS_ROOT" /bin/sh -c '
                L=/var/lock/cron.lock.cru-probe
                rm -f "$L"
                exec 278>"$L"
                /usr/bin/flock -x 278
                acquire_rc=$?
                (
                  exec 279>"$L"
                  /usr/bin/flock -n -x 279
                )
                contend_rc=$?
                exec 278>&-
                (
                  exec 279>"$L"
                  /usr/bin/flock -n -x 279
                )
                release_rc=$?
                rm -f "$L"
                echo "acquire_rc=$acquire_rc contend_rc=$contend_rc release_rc=$release_rc"
                [ "$acquire_rc" -eq 0 ] && [ "$contend_rc" -ne 0 ] && [ "$release_rc" -eq 0 ]
              ' > reports/flock-chroot.txt 2>&1
              flock_rc=$?
              set -e
              echo "flock_chroot_test_rc=$flock_rc" >> "$OUT"
              cat reports/flock-chroot.txt >> "$OUT" || true
              if [ "$flock_rc" -eq 0 ]; then
                echo 'flock_fd_semantics=PASS' >> "$OUT"
                echo 'CLASSIFICATION=EXACT_CRU_FLOCK_PATCH_JUSTIFIED' >> "$OUT"
              else
                echo 'flock_fd_semantics=FAIL' >> "$OUT"
                echo 'CLASSIFICATION=KEEP_ASUS_CRU_NO_FLOCK_ADAPT' >> "$OUT"
              fi
            else
              echo 'flock_fd_semantics=UNTESTABLE_WITH_BINFMT' >> "$OUT"
              echo 'CLASSIFICATION=KEEP_ASUS_CRU_NO_UNPROVEN_ADAPT' >> "$OUT"
            fi
          else
            echo 'flock_path=MISSING' >> "$OUT"
          fi
          echo >> "$OUT"

          echo '===== CROND SURFACE =====' >> "$OUT"
          for side in ASUS MERLIN; do
            if [ "$side" = ASUS ]; then R="$ASUS_ROOT"; else R="$MERLIN_ROOT"; fi
            for rel in usr/sbin/crond sbin/crond usr/bin/crond bin/crond; do
              if [ -e "$R/$rel" ]; then
                echo "$side /$rel -> $(readlink "$R/$rel" || true)" >> "$OUT"
              fi
            done
          done
          cat "$OUT"
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cru-52334-compatibility
          path: reports/cru-52334-compatibility.txt
          if-no-files-found: error
          retention-days: 14
