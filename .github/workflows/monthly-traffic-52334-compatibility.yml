name: Probe ASUS 52334 monthly traffic compatibility

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/monthly-traffic-52334-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip binutils file
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch and extract verified ASUS 52334
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/asus work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o work/artifacts/FW_RT-AC86U_300438652334.zip \
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/FW_RT-AC86U_300438652334.zip' | sha256sum -c -
          unzip -q work/artifacts/FW_RT-AC86U_300438652334.zip -d work/asus
          cd work/asus
          FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
          test -n "$FW"
          binwalk -Me "$FW" >/dev/null
          cd ../..
          ASUS_ROOT="$(find work/asus -type d -name rootfs_ubifs -print -quit)"
          test -n "$ASUS_ROOT"
          echo "ASUS_ROOT=$ASUS_ROOT" >> "$GITHUB_ENV"

      - name: Probe monthly traffic contract
        shell: bash
        run: |
          set -euo pipefail
          R="$ASUS_ROOT"
          OUT=reports/monthly-traffic-52334-compatibility.txt
          : > "$OUT"
          section() { printf '\n===== %s =====\n' "$1" >> "$OUT"; }

          section 'STAGED ADAPTER'
          sha256sum ports/files/Main_TrafficMonitor_monthly.asp ports/files/chart.min.js >> "$OUT"
          grep -F '<% bandwidth("monthly"); %>' ports/files/Main_TrafficMonitor_monthly.asp >> "$OUT"
          if grep -Eq 'cstats_enable|Main_TrafficMonitor_dev(realtime|daily|monthly)\.asp' ports/files/Main_TrafficMonitor_monthly.asp; then
            echo 'ERROR staged monthly adapter still references unsupported per-device surface' >> "$OUT"
            exit 1
          else
            echo 'PASS staged adapter is global-rstats only' >> "$OUT"
          fi

          section 'TRAFFIC MONITOR PAGES'
          find "$R/www" -maxdepth 1 -type f -name 'Main_TrafficMonitor*' -printf '%f\n' | sort >> "$OUT" || true

          section 'REQUIRED STATIC ASSETS'
          for rel in state.js help.js general.js tmmenu.js tmhist.js popup.js js/jquery.js js/httpApi.js; do
            if [ -f "$R/www/$rel" ]; then
              printf 'PASS /www/%s\n' "$rel" >> "$OUT"
              sha256sum "$R/www/$rel" >> "$OUT"
            else
              printf 'MISSING /www/%s\n' "$rel" >> "$OUT"
            fi
          done

          section 'HTTPD BANDWIDTH SURFACE'
          strings -a "$R/usr/sbin/httpd" | grep -Ei             'bandwidth|monthly_history|daily_history|speed_history|rstats|cstats'             | sort -u >> "$OUT" || true

          section 'WEB BANDWIDTH CALLS'
          grep -RInaE --binary-files=without-match             '<%[[:space:]]*bandwidth\("(monthly|daily|speed)"\)'             "$R/www" 2>/dev/null | head -n 300 >> "$OUT" || true

          section 'DAILY PAGE NAVIGATION PREIMAGE'
          sha256sum "$R/www/Main_TrafficMonitor_daily.asp" >> "$OUT"
          grep -n -A35 -B5 'function switchPage' "$R/www/Main_TrafficMonitor_daily.asp" >> "$OUT" || true
          grep -n -A18 -B3 'id="page_select"' "$R/www/Main_TrafficMonitor_daily.asp" >> "$OUT" || true

          section 'DEVICE TRAFFIC SURFACE'
          for rel in Main_TrafficMonitor_devrealtime.asp Main_TrafficMonitor_devdaily.asp Main_TrafficMonitor_devmonthly.asp; do
            [ -f "$R/www/$rel" ] && echo "PRESENT $rel" >> "$OUT" || echo "MISSING $rel" >> "$OUT"
          done
          strings -a "$R/usr/sbin/httpd" | grep -Ei             'ipt_bandwidth|cstats|traffic.*client|client.*traffic|monthly_history'             | sort -u >> "$OUT" || true

          section 'NVRAM SUPPORT'
          for key in rstats_enable rstats_path rstats_stime rstats_offset cstats_enable; do
            hits=0
            strings -a "$R/sbin/rc" | grep -Fxq "$key" && hits=$((hits+1)) || true
            strings -a "$R/usr/sbin/httpd" | grep -Fxq "$key" && hits=$((hits+1)) || true
            strings -a "$R/bin/rstats" | grep -Fxq "$key" && hits=$((hits+1)) || true
            printf '%-16s components=%d\n' "$key" "$hits" >> "$OUT"
          done

          section 'SUMMARY'
          failed=0
          for rel in state.js help.js general.js tmmenu.js tmhist.js popup.js js/jquery.js js/httpApi.js; do
            if [ -f "$R/www/$rel" ]; then
              echo "PASS asset::$rel" >> "$OUT"
            else
              echo "MISSING asset::$rel" >> "$OUT"
              failed=1
            fi
          done
          if strings -a "$R/usr/sbin/httpd" | grep -Fxq 'bandwidth'; then
            echo 'PASS httpd::bandwidth' >> "$OUT"
          else
            echo 'MISSING httpd::bandwidth' >> "$OUT"
            failed=1
          fi
          # The ASUS rstats history spool contains both daily_history and
          # monthly_history.  The bandwidth EJ handler exposes the same history
          # spool used by the stock daily page, so an exact "monthly" string in
          # stripped httpd is not a valid requirement.
          if strings -a "$R/usr/sbin/httpd" | grep -Fxq '/var/spool/rstats-history.js'; then
            echo 'PASS httpd::rstats-history-spool' >> "$OUT"
          else
            echo 'MISSING httpd::rstats-history-spool' >> "$OUT"
            failed=1
          fi

          if strings -a "$R/bin/rstats" | grep -Fq 'MONTHLY: p='; then
            echo 'PASS rstats::monthly-history' >> "$OUT"
          else
            echo 'MISSING rstats::monthly-history' >> "$OUT"
            failed=1
          fi

          if [ -f "$R/www/js/chart.min.js" ]; then
            echo 'STOCK asset::js/chart.min.js' >> "$OUT"
          else
            echo 'ADD-ONLY candidate::js/chart.min.js' >> "$OUT"
          fi

          cat "$OUT"
          exit "$failed"

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-traffic-52334-compatibility
          path: reports/monthly-traffic-52334-compatibility.txt
          if-no-files-found: error
          retention-days: 14
