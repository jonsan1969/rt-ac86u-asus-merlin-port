name: Validate preserved hardware bundle verifier
on:
  push:
    branches: [asus-52334-merlin-port]
    paths:
      - scripts/verify-hardware-validation-bundle.py
      - .github/workflows/validate-hardware-validation-bundle-verifier.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-hardware-validation-bundle.py
          python3 scripts/verify-hardware-validation-bundle.py --help >/dev/null
      - name: Download exact preserved hardware bundle
        uses: actions/download-artifact@v4
        with:
          name: hardware-validation-bundle-eac8a777
          path: work/hardware
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36998454435
      - name: Locate bundle root
        run: |
          set -euo pipefail
          manifest="$(find work/hardware -type f -name BUNDLE-MANIFEST.txt -print -quit)"
          test -n "$manifest"
          dirname "$manifest" > work/root.txt
      - name: PASS exact preserved bundle
        run: |
          set -euo pipefail
          root="$(cat work/root.txt)"
          python3 scripts/verify-hardware-validation-bundle.py --bundle-root "$root" --report work/pass.json | tee work/pass.txt
          grep -Fq HARDWARE_VALIDATION_BUNDLE_PASS work/pass.txt
          grep -Fq '"file_count": 104' work/pass.json
      - name: FAIL changed bundle file
        run: |
          set -euo pipefail
          root="$(cat work/root.txt)"
          cp -a "$root" work/bad-file
          printf X >> work/bad-file/docs/STATUS.md
          if python3 scripts/verify-hardware-validation-bundle.py --bundle-root work/bad-file; then exit 1; fi
      - name: FAIL changed manifest
        run: |
          set -euo pipefail
          root="$(cat work/root.txt)"
          cp -a "$root" work/bad-manifest
          sed -i 's/candidate_size=78250004/candidate_size=1/' work/bad-manifest/BUNDLE-MANIFEST.txt
          if python3 scripts/verify-hardware-validation-bundle.py --bundle-root work/bad-manifest; then exit 1; fi
      - name: FAIL extra file
        run: |
          set -euo pipefail
          root="$(cat work/root.txt)"
          cp -a "$root" work/extra
          touch work/extra/unexpected.txt
          if python3 scripts/verify-hardware-validation-bundle.py --bundle-root work/extra; then exit 1; fi
      - name: FAIL symlink injection
        run: |
          set -euo pipefail
          root="$(cat work/root.txt)"
          cp -a "$root" work/symlink
          ln -s docs/STATUS.md work/symlink/unexpected-link
          if python3 scripts/verify-hardware-validation-bundle.py --bundle-root work/symlink; then exit 1; fi
