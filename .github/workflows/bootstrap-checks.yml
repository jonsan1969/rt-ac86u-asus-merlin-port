name: Bootstrap checks

on:
  push:
    branches:
      - main
      - asus-52334-analysis
      - asus-52334-merlin-port
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate artifact lock JSON
        run: python3 -m json.tool artifacts.lock.json >/dev/null

      - name: Syntax-check Python tools
        run: python3 -m py_compile tools/*.py

      - name: Syntax-check shell scripts
        run: bash -n scripts/*.sh
