name: Probe Merlin nano bundle on ASUS 52334

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/nano-52334-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction and ARM execution tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip qemu-user-static file binutils
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch and extract verified images
        run: |
          set -euo pipefail
          mkdir -p work/asus work/merlin work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/asus.zip             'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/merlin.zip             'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/asus.zip' | sha256sum -c -
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/artifacts/merlin.zip' | sha256sum -c -
          unzip -q work/artifacts/asus.zip -d work/asus
          unzip -q work/artifacts/merlin.zip -d work/merlin
          for d in asus merlin; do
            (
              cd "work/$d"
              FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
              binwalk -Me "$FW" >/dev/null
            )
            ROOT="$(find "work/$d" -type d -name rootfs_ubifs -print -quit)"
            test -n "$ROOT"
            if [ "$d" = asus ]; then echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"; else echo "MERLIN_ROOT=$ROOT" >> "$GITHUB_ENV"; fi
          done
      - name: Probe nano dependency bundle
        run: |
          set -euo pipefail
          A="$ASUS_ROOT"; M="$MERLIN_ROOT"; OUT=reports/nano-52334-compatibility.txt
          : > "$OUT"
          N="$M/usr/bin/nano"
          test -f "$N"
          echo '===== NANO =====' >> "$OUT"
          file "$N" >> "$OUT"
          sha256sum "$N" >> "$OUT"
          readelf -d "$N" | grep NEEDED >> "$OUT" || true

          echo '===== NCURSES =====' >> "$OUT"
          for rel in lib/libncurses.so.6 usr/lib/libncurses.so.6 lib/libncursesw.so.6 usr/lib/libncursesw.so.6; do
            if [ -e "$M/$rel" ]; then
              echo "MERLIN $rel -> $(readlink "$M/$rel" || true)" >> "$OUT"
              [ -f "$M/$rel" ] && sha256sum "$M/$rel" >> "$OUT" || true
            fi
            if [ -e "$A/$rel" ]; then
              echo "ASUS $rel -> $(readlink "$A/$rel" || true)" >> "$OUT"
            fi
          done
          find "$M/lib" "$M/usr/lib" -maxdepth 1 \( -type f -o -type l \) -name 'libncurses*' -printf 'MERLIN_NCURSES %p -> %l\n' >> "$OUT" 2>/dev/null || true
          find "$A/lib" "$A/usr/lib" -maxdepth 1 \( -type f -o -type l \) -name 'libncurses*' -printf 'ASUS_NCURSES %p -> %l\n' >> "$OUT" 2>/dev/null || true

          echo '===== TERMINFO =====' >> "$OUT"
          for p in usr/share/terminfo share/terminfo etc/terminfo; do
            [ -d "$M/$p" ] && echo "MERLIN /$p files=$(find "$M/$p" -type f | wc -l)" >> "$OUT" || true
            [ -d "$A/$p" ] && echo "ASUS /$p files=$(find "$A/$p" -type f | wc -l)" >> "$OUT" || true
          done

          echo '===== STAGED EXECUTION TEST =====' >> "$OUT"
          S=work/nano-stage
          rm -rf "$S"
          cp -a "$A" "$S"
          mkdir -p "$S/usr/bin"
          cp "$N" "$S/usr/bin/nano"
          chmod 755 "$S/usr/bin/nano"
          # Add only the exact Merlin library objects needed by nano, never overwrite ASUS files.
          libsrc="$(find "$M/lib" "$M/usr/lib" -maxdepth 1 -type f -name 'libncurses.so.6*' -print -quit)"
          if [ -z "$libsrc" ]; then
            linksrc="$(find "$M/lib" "$M/usr/lib" -maxdepth 1 -type l -name 'libncurses.so.6' -print -quit)"
            if [ -n "$linksrc" ]; then
              target="$(readlink "$linksrc")"
              libsrc="$(dirname "$linksrc")/$target"
            fi
          fi
          if [ -n "$libsrc" ] && [ -f "$libsrc" ]; then
            base="$(basename "$libsrc")"
            cp "$libsrc" "$S/usr/lib/$base"
            [ "$base" = libncurses.so.6 ] || ln -s "$base" "$S/usr/lib/libncurses.so.6"
            echo "staged_library=$base" >> "$OUT"
          else
            echo 'staged_library=MISSING' >> "$OUT"
          fi

          if qemu-arm-static -L "$S" "$S/usr/bin/nano" --version > reports/nano-version.txt 2>reports/nano-qemu.err; then
            echo 'QEMU_NANO_VERSION=PASS' >> "$OUT"
            cat reports/nano-version.txt >> "$OUT"
          else
            echo 'QEMU_NANO_VERSION=FAIL' >> "$OUT"
            cat reports/nano-qemu.err >> "$OUT"
          fi

          echo '===== CLASSIFICATION =====' >> "$OUT"
          if grep -q 'QEMU_NANO_VERSION=PASS' "$OUT"; then
            echo 'CLASSIFICATION=ADD_ONLY_BUNDLE_CANDIDATE' >> "$OUT"
          else
            echo 'CLASSIFICATION=DEPENDENCY_GAP' >> "$OUT"
          fi
          cat "$OUT"
      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-52334-compatibility
          path: reports/
          if-no-files-found: error
          retention-days: 14
