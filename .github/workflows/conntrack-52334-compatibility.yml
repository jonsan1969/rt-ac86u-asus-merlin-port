name: Probe ASUS 52334 conntrack compatibility

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/conntrack-52334-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip binutils
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch verified ASUS 52334
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/asus work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30             -o work/artifacts/FW_RT-AC86U_300438652334.zip             'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/FW_RT-AC86U_300438652334.zip' | sha256sum -c -
          unzip -q work/artifacts/FW_RT-AC86U_300438652334.zip -d work/asus

      - name: Extract ASUS rootfs
        shell: bash
        run: |
          set -euo pipefail
          cd work/asus
          FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
          test -n "$FW"
          binwalk -Me "$FW" >/dev/null
          cd ../..
          ASUS_ROOT="$(find work/asus -type d -name rootfs_ubifs -print -quit)"
          test -n "$ASUS_ROOT"
          echo "ASUS_ROOT=$ASUS_ROOT" >> "$GITHUB_ENV"

      - name: Probe conntrack backend and UI surface
        shell: bash
        run: |
          set -euo pipefail
          R="$ASUS_ROOT"
          OUT=reports/conntrack-52334-probe.txt
          : > "$OUT"

          section() { printf '\n===== %s =====\n' "$1" >> "$OUT"; }

          section 'RC BACKEND STRINGS'
          strings -a "$R/sbin/rc" | grep -E             'ct_max|ct_tcp_timeout|ct_udp_timeout|restart_conntrack|conntrack|nf_conntrack_(tcp|udp)|ip_conntrack_(tcp|udp)'             | sort -u >> "$OUT" || true

          section 'HTTPD STRINGS'
          strings -a "$R/usr/sbin/httpd" | grep -E             'ct_max|ct_tcp_timeout|ct_udp_timeout|restart_conntrack|conntrack'             | sort -u >> "$OUT" || true

          section 'WEBUI REFERENCES'
          grep -RInaE --binary-files=without-match             'ct_max|ct_tcp_timeout|ct_udp_timeout|restart_conntrack|TCP Timeout|UDP Timeout|conntrack'             "$R/www" 2>/dev/null | head -n 500 >> "$OUT" || true

          section 'RELEVANT STOCK PAGES'
          for p in Advanced_Firewall_Content.asp Advanced_System_Content.asp Tools_OtherSettings.asp; do
            if [ -f "$R/www/$p" ]; then
              echo "PRESENT /www/$p" >> "$OUT"
              sha256sum "$R/www/$p" >> "$OUT"
            else
              echo "MISSING /www/$p" >> "$OUT"
            fi
          done

          section 'REQUIRED SIGNATURE SUMMARY'
          failed=0
          for sig in ct_max ct_tcp_timeout ct_udp_timeout restart_conntrack; do
            if strings -a "$R/sbin/rc" | grep -Fxq "$sig"; then
              echo "PASS rc::$sig" >> "$OUT"
            else
              echo "MISSING rc::$sig" >> "$OUT"
              failed=1
            fi
          done
          cat "$OUT"
          exit "$failed"

      - name: Publish probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conntrack-52334-compatibility
          path: reports/conntrack-52334-probe.txt
          if-no-files-found: error
          retention-days: 14
