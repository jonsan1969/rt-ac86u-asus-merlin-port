name: Preserve hardware validation bundle

on:
  push:
    branches: [asus-52334-merlin-port]
    paths:
      - .github/workflows/preserve-hardware-validation-bundle.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify official ASUS 386_52334 stock image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/official-stock
          zip=work/asus-52334.zip
          urls=(
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT_AC86U_300438652334.zip?model=RT-AC86U'
          )
          ok=0
          for url in "${urls[@]}"; do
            if curl -fL --retry 4 --retry-delay 2 "$url" -o "$zip"; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          test "$(sha256sum "$zip" | awk '{print $1}')" = e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61
          unzip -q "$zip" -d work/official-stock/unpacked
          mapfile -t stock < <(find work/official-stock/unpacked -type f -name '*.w' -print)
          test "${#stock[@]}" -eq 1
          test "$(sha256sum "${stock[0]}" | awk '{print $1}')" = 1b4fe984e13afdf0a69c11bda759f3222822e12f5b8c929da33f334f2cc7483f
          test "$(stat -c %s "${stock[0]}")" -eq 78250004
          cp "${stock[0]}" work/official-stock/RT-AC86U_386_52334_OFFICIAL.w

      - name: Download exact UNVALIDATED candidate
        uses: actions/download-artifact@v4
        with:
          name: RT-AC86U-52334-merlin-port-UNVALIDATED
          path: work/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36924014278

      - name: Download exact K2 ipset family
        uses: actions/download-artifact@v4
        with:
          name: kernel-k2-ipset-51997
          path: work/k2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36556899650

      - name: Download exact K3 optional families
        uses: actions/download-artifact@v4
        with:
          name: kernel-k3-optional-modules-51997
          path: work/k3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36561957525

      - name: Download exact K4 ipset userspace companion
        uses: actions/download-artifact@v4
        with:
          name: k4-ipset-userspace-51997
          path: work/k4-ipset-userspace
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36971390631

      - name: Download exact K4 WireGuard userspace companion
        uses: actions/download-artifact@v4
        with:
          name: k4-wireguard-userspace-51997
          path: work/k4-wireguard-userspace
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36971511361

      - name: Download exact K4 Cake userspace companion
        uses: actions/download-artifact@v4
        with:
          name: k4-cake-userspace-51997
          path: work/k4-cake-userspace
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36972043724

      - name: Download exact K4 module dependency closure
        uses: actions/download-artifact@v4
        with:
          name: k4-module-dependency-closure
          path: work/k4-module-dependency-closure
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36976006891

      - name: Download exact K4 family staging bundles
        uses: actions/download-artifact@v4
        with:
          name: k4-family-staging-bundles
          path: work/k4-family-staging
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36978077020

      - name: Verify candidate and module identities
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fw < <(find work/candidate -type f -name '*UNVALIDATED*.w' -print)
          test "${#fw[@]}" -eq 1
          test "$(stat -c %s "${fw[0]}")" -eq 78250004
          test "$(sha256sum "${fw[0]}" | awk '{print $1}')" = eac8a7778bbc68686f68f1750c496fe6ddf92d689aa5e5878bacb9f02b9204b3

          find_one() {
            local root="$1" name="$2"
            mapfile -t hit < <(find "$root" -type f -name "$name" -print)
            test "${#hit[@]}" -eq 1
            printf '%s\n' "${hit[0]}"
          }
          check_hash() {
            local root="$1" name="$2" want="$3" p
            p="$(find_one "$root" "$name")"
            test "$(sha256sum "$p" | awk '{print $1}')" = "$want"
          }

          test "$(find work/k2 -type f -name '*.ko' | wc -l)" -eq 18
          check_hash work/k2 ip_set.ko 19c47ab22f38c50e3ddfea153e54c10e4c4ecb244fe1fa77e225c0bca94162b6
          check_hash work/k2 ip_set_hash_ip.ko e1179e36ebad16843537338fae3134f75c672161a1702f518a64cebeab1cb93d
          check_hash work/k2 ip_set_list_set.ko 060bce188e4f4ac42064e4c9774f637dcee84b0cea5bb0d3e858a0ae28464cf5
          check_hash work/k2 xt_set.ko 6ed89a951afdabf5b93158d7ef8edc0c7804b51df0c98f3f8c64500a47fb0b3a

          for name in sunrpc.ko lockd.ko nfs.ko nfsv2.ko nfsv3.ko nfsd.ko cifs.ko sch_cake.ko wireguard.ko; do
            find_one work/k3 "$name" >/dev/null
          done
          test "$(find work/k3 -type f -name '*.ko' | wc -l)" -eq 9
          check_hash work/k3 sunrpc.ko b547166600f2e2c0b6ff7356010b7eeec509139b928cc01236e8cba2820b1241
          check_hash work/k3 nfs.ko 82f8a84767334ab49a032f5b96f59960cd4e207336b9b8995c9442947631bf5d
          check_hash work/k3 nfsd.ko 953d838733e9ab740980ecd5f0a5c76ddbcfafef8c0af1621171551406a8a293
          check_hash work/k3 cifs.ko eb545f7ce5429477f081ef0c4d1c5d1b8eca519d9025afdc2a225417417567b8
          check_hash work/k3 sch_cake.ko 159256eb407a76d0ac38b53c3eea36ef74d054b1afe60329a61aad0e5024f24c
          check_hash work/k3 wireguard.ko 418f6e212f4d8f3f83142352f462fd870b591602f45b8af0564ecd72c7e5161c

          test -f work/k4-ipset-userspace/k4-ipset-userspace-51997.tar.gz
          test -f work/k4-ipset-userspace/reports/archive-sha256.txt
          (
            cd work/k4-ipset-userspace
            sha256sum -c reports/archive-sha256.txt
          )
          mkdir -p work/k4-ipset-unpacked
          tar -xzf work/k4-ipset-userspace/k4-ipset-userspace-51997.tar.gz -C work/k4-ipset-unpacked
          test -x work/k4-ipset-unpacked/bundle/bin/ipset
          test -x work/k4-ipset-unpacked/bundle/bin/ipset.real
          test -f work/k4-ipset-unpacked/bundle/lib/libipset.so.13.1.0
          test -L work/k4-ipset-unpacked/bundle/lib/libipset.so.13
          test "$(readlink work/k4-ipset-unpacked/bundle/lib/libipset.so.13)" = libipset.so.13.1.0
          test -f work/k4-ipset-unpacked/reports/K4-IPSET-USERSPACE-MANIFEST.txt
          grep -Fq 'source_sha=c553d8e4b0bf3289683368b0d57172649b030039' work/k4-ipset-unpacked/reports/K4-IPSET-USERSPACE-MANIFEST.txt
          grep -Fq 'toolchain_sha=7710a1e09d994598ac6c2db8ab16dc54ca5aed3d' work/k4-ipset-unpacked/reports/K4-IPSET-USERSPACE-MANIFEST.txt
          grep -Fq 'kernel_family_run=36556899650' work/k4-ipset-unpacked/reports/K4-IPSET-USERSPACE-MANIFEST.txt
          grep -Fq 'classification=K4_TEMPORARY_IPSET_USERSPACE_ONLY' work/k4-ipset-unpacked/reports/K4-IPSET-USERSPACE-MANIFEST.txt
          grep -Fq 'libipset.so.13' work/k4-ipset-unpacked/reports/needed-closure.txt
          grep -Fq 'libmnl.so.0' work/k4-ipset-unpacked/reports/needed-closure.txt
          grep -Fq 'ipset v7.6, protocol version: 7' work/k4-ipset-unpacked/reports/ipset-version.txt
          (
            cd work/k4-ipset-unpacked
            grep -E '^[0-9a-f]{64}  ' reports/K4-IPSET-USERSPACE-MANIFEST.txt | sha256sum -c -
          )

          test -f work/k4-wireguard-userspace/k4-wireguard-userspace-51997.tar.gz
          test -f work/k4-wireguard-userspace/reports/archive-sha256.txt
          (
            cd work/k4-wireguard-userspace
            sha256sum -c reports/archive-sha256.txt
          )
          mkdir -p work/k4-wireguard-unpacked
          tar -xzf work/k4-wireguard-userspace/k4-wireguard-userspace-51997.tar.gz -C work/k4-wireguard-unpacked
          test -x work/k4-wireguard-unpacked/bundle/bin/wg
          test -f work/k4-wireguard-unpacked/reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt
          grep -Fq 'source_sha=c553d8e4b0bf3289683368b0d57172649b030039' work/k4-wireguard-unpacked/reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt
          grep -Fq 'toolchain_sha=7710a1e09d994598ac6c2db8ab16dc54ca5aed3d' work/k4-wireguard-unpacked/reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt
          grep -Fq 'kernel_family_run=36561957525' work/k4-wireguard-unpacked/reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt
          grep -Fq 'wireguard_tools_version=1.0.20200827' work/k4-wireguard-unpacked/reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt
          grep -Fq 'classification=K4_TEMPORARY_WIREGUARD_USERSPACE_ONLY' work/k4-wireguard-unpacked/reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt
          grep -Fq 'wireguard-tools v1.0.20200827' work/k4-wireguard-unpacked/reports/wg-version.txt
          (
            cd work/k4-wireguard-unpacked
            grep -E '^[0-9a-f]{64}  ' reports/K4-WIREGUARD-USERSPACE-MANIFEST.txt | sha256sum -c -
          )

          test -f work/k4-cake-userspace/k4-cake-userspace-51997.tar.gz
          test -f work/k4-cake-userspace/reports/archive-sha256.txt
          (
            cd work/k4-cake-userspace
            sha256sum -c reports/archive-sha256.txt
          )
          mkdir -p work/k4-cake-unpacked
          tar -xzf work/k4-cake-userspace/k4-cake-userspace-51997.tar.gz -C work/k4-cake-unpacked
          test -x work/k4-cake-unpacked/bundle/bin/tc
          grep -Fq 'source_sha=c553d8e4b0bf3289683368b0d57172649b030039' work/k4-cake-unpacked/reports/K4-CAKE-USERSPACE-MANIFEST.txt
          grep -Fq 'kernel_family_run=36561957525' work/k4-cake-unpacked/reports/K4-CAKE-USERSPACE-MANIFEST.txt
          grep -Fq 'iproute2_version=5.11.0' work/k4-cake-unpacked/reports/K4-CAKE-USERSPACE-MANIFEST.txt
          grep -Fq 'classification=K4_TEMPORARY_CAKE_TC_ONLY' work/k4-cake-unpacked/reports/K4-CAKE-USERSPACE-MANIFEST.txt
          grep -Fq 'cake_qdisc_util' work/k4-cake-unpacked/reports/tc.symbols.txt
          grep -Fq 'iproute2-5.11.0' work/k4-cake-unpacked/reports/tc-version.txt
          grep -Fq 'Usage: ... cake' work/k4-cake-unpacked/reports/cake-help.txt
          (
            cd work/k4-cake-unpacked
            grep -E '^[0-9a-f]{64}  ' reports/K4-CAKE-USERSPACE-MANIFEST.txt | sha256sum -c -
          )

          test -f work/k4-module-dependency-closure/k4-module-dependency-closure.json
          python3 - <<'PY'
          import json
          r=json.load(open('work/k4-module-dependency-closure/k4-module-dependency-closure.json'))
          assert r['schema'] == 2
          assert r['source_preservation_run'] == 36972221014
          assert r['families']['cifs']['load_order'] == ['cifs']
          assert r['families']['nfs_sunrpc_lockd']['load_order'] == ['sunrpc','lockd','nfs','nfsd','nfsv2','nfsv3']
          assert r['families']['nfs_sunrpc_lockd']['unload_order'] == ['nfsv3','nfsv2','nfsd','nfs','lockd','sunrpc']
          assert not r['families']['cifs']['declared_external_depends']
          assert not r['families']['nfs_sunrpc_lockd']['declared_external_depends']
          PY

          test -f work/k4-family-staging/package-sha256.txt
          for fam in ipset cake cifs nfs wireguard; do
            test -f "work/k4-family-staging/k4-family-$fam.tar.gz"
          done
          (
            cd work/k4-family-staging
            sha256sum -c package-sha256.txt
          )
          rm -rf work/k4-family-staging-verify
          mkdir -p work/k4-family-staging-verify
          for archive in work/k4-family-staging/k4-family-*.tar.gz; do
            fam="$(basename "$archive" .tar.gz)"
            fam="${fam#k4-family-}"
            mkdir -p "work/k4-family-staging-verify/$fam"
            tar -xzf "$archive" -C "work/k4-family-staging-verify/$fam"
            test -f "work/k4-family-staging-verify/$fam/$fam/MANIFEST.txt"
            grep -Fq 'classification=K4_TEMPORARY_FAMILY_STAGING_ONLY' "work/k4-family-staging-verify/$fam/$fam/MANIFEST.txt"
            grep -Fq 'candidate_sha256=eac8a7778bbc68686f68f1750c496fe6ddf92d689aa5e5878bacb9f02b9204b3' "work/k4-family-staging-verify/$fam/$fam/MANIFEST.txt"
            (
              cd "work/k4-family-staging-verify/$fam/$fam"
              grep -E '^[0-9a-f]{64}  ' MANIFEST.txt | sha256sum -c -
            )
          done

      - name: Assemble hash-bound hardware validation bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/official-stock bundle/candidate bundle/modules/k2 bundle/modules/k3 bundle/userspace/ipset bundle/userspace/wireguard bundle/userspace/cake bundle/k4-family-staging bundle/reports bundle/scripts bundle/docs bundle/optional
          cp work/official-stock/RT-AC86U_386_52334_OFFICIAL.w bundle/official-stock/
          cp work/candidate/* bundle/candidate/
          cp -a work/k2/. bundle/modules/k2/
          cp -a work/k3/. bundle/modules/k3/
          cp work/k4-ipset-userspace/k4-ipset-userspace-51997.tar.gz bundle/userspace/ipset/
          cp work/k4-ipset-userspace/reports/archive-sha256.txt bundle/userspace/ipset/
          cp work/k4-wireguard-userspace/k4-wireguard-userspace-51997.tar.gz bundle/userspace/wireguard/
          cp work/k4-wireguard-userspace/reports/archive-sha256.txt bundle/userspace/wireguard/
          cp work/k4-cake-userspace/k4-cake-userspace-51997.tar.gz bundle/userspace/cake/
          cp work/k4-cake-userspace/reports/archive-sha256.txt bundle/userspace/cake/
          cp work/k4-module-dependency-closure/k4-module-dependency-closure.json bundle/reports/
          cp work/k4-family-staging/k4-family-*.tar.gz bundle/k4-family-staging/
          cp work/k4-family-staging/package-sha256.txt bundle/k4-family-staging/
          cp scripts/prepare-candidate-evidence.sh bundle/scripts/
          cp scripts/k4-router-preflight.sh bundle/scripts/
          cp scripts/runtime-feature-preflight.sh bundle/scripts/
          cp scripts/verify-hardware-evidence.py bundle/scripts/
          cp scripts/verify-m49-ej-response.py bundle/scripts/
          cp scripts/verify-k4-symbol-preflight.py bundle/scripts/
          cp scripts/verify-k4-family-staging.py bundle/scripts/
          cp docs/candidate-promotion-gate.md bundle/docs/
          cp docs/k4-controlled-module-validation.md bundle/docs/
          cp docs/k4-router-preflight.md bundle/docs/
          cp docs/monthly-traffic-optional-delivery.md bundle/docs/
          cp docs/m49-ej-response-evidence.md bundle/docs/
          cp docs/hardware-evidence-verifier.md bundle/docs/
          cp docs/k4-symbol-preflight.md bundle/docs/
          cp docs/k4-family-staging-bundles.md bundle/docs/
          cp docs/pre-k4-host-gates.md bundle/docs/
          cp docs/physical-validation-sequence.md bundle/docs/
          cp docs/preflash-backup-recovery.md bundle/docs/
          cp docs/thread-handoff.md bundle/docs/
          cp STATUS.md bundle/docs/
          cp -a optional/monthly-traffic bundle/optional/

          cat > bundle/BUNDLE-README.txt <<EOF
          RT-AC86U ASUS 386_52334 hardware-validation bundle
          preservation_run=${GITHUB_RUN_ID}
          snapshot_commit=${GITHUB_SHA}
          candidate_sha256=eac8a7778bbc68686f68f1750c496fe6ddf92d689aa5e5878bacb9f02b9204b3
          classification=UNVALIDATED_HARDWARE_VALIDATION_INPUT

          Authority rules:
          - BUNDLE-MANIFEST.txt is authoritative for this extracted bundle's file inventory and hashes.
          - This README identifies the preservation run and source snapshot without requiring copied docs to self-reference the artifact that contains them.
          - Artifact id/ZIP digest are transport metadata; never use them as firmware identity.
          - Copied docs may describe historical preservation checkpoints. For physical use, verify this bundle first with the current repo-side preserved-bundle verifier, then follow the current repo-side promotion/physical-validation docs.
          EOF

          {
            echo 'official_stock_sha256=1b4fe984e13afdf0a69c11bda759f3222822e12f5b8c929da33f334f2cc7483f'
            echo 'official_stock_size=78250004'
            echo 'candidate_run=36924014278'
            echo 'candidate_sha256=eac8a7778bbc68686f68f1750c496fe6ddf92d689aa5e5878bacb9f02b9204b3'
            echo 'candidate_size=78250004'
            echo 'k2_run=36556899650'
            echo 'k3_run=36561957525'
            echo 'k4_ipset_userspace_run=36971390631'
            echo 'k4_wireguard_userspace_run=36971511361'
            echo 'k4_cake_userspace_run=36972043724'
            echo 'k4_module_dependency_run=36976006891'
            echo 'k4_family_staging_run=36978077020'
            echo 'k4_symbol_preflight_ci_run=36977341893'
            echo 'k4_family_staging_verifier_ci_run=36994228096'
            echo 'pre_k4_host_orchestrator_ci_run=37006423674'
            echo 'candidate_evidence_ci_run=36998249913'
            echo 'preservation_run='${GITHUB_RUN_ID}
            echo 'docs_snapshot_commit='${GITHUB_SHA}
            echo 'source_commit='${GITHUB_SHA}
            echo 'classification=UNVALIDATED_HARDWARE_VALIDATION_INPUT'
            echo
            echo '===== FILE SHA256 ====='
            find bundle -type f ! -name BUNDLE-MANIFEST.txt -print0 | sort -z | xargs -0 sha256sum
          } > bundle/BUNDLE-MANIFEST.txt

          grep -Fq 'classification=UNVALIDATED_HARDWARE_VALIDATION_INPUT' bundle/BUNDLE-MANIFEST.txt
          grep -Fq 'candidate_sha256=eac8a7778bbc68686f68f1750c496fe6ddf92d689aa5e5878bacb9f02b9204b3' bundle/BUNDLE-MANIFEST.txt

      - name: Publish preserved hardware validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: hardware-validation-bundle-eac8a777
          path: bundle
          if-no-files-found: error
          retention-days: 90
