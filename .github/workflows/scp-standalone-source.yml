name: Verify standalone SCP source path

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/scp-standalone-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ASUS lineage and pinned Merlin Dropbear
        run: |
          set -euo pipefail
          mkdir -p work reports

          git init work/asus
          git -C work/asus remote add origin https://github.com/blackfuel/asuswrt-rt-ac86u.git
          git -C work/asus sparse-checkout init --cone
          git -C work/asus sparse-checkout set release/src/router/dropbear
          git -C work/asus fetch --depth=1 --filter=blob:none origin a9179fc9329565dea0f7c5c7648fe8ad49ceaaf6
          git -C work/asus checkout --detach FETCH_HEAD

          git init work/merlin
          git -C work/merlin remote add origin https://github.com/RMerl/asuswrt-merlin.ng.git
          git -C work/merlin sparse-checkout init --cone
          git -C work/merlin sparse-checkout set release/src/router/dropbear
          git -C work/merlin fetch --depth=1 --filter=blob:none origin 6a5df61aab6f3fa2dffc518994d42e4f2a27fb2b
          git -C work/merlin checkout --detach FETCH_HEAD

      - name: Verify standalone SCP invariants
        run: |
          set -euo pipefail
          A=work/asus/release/src/router/dropbear
          M=work/merlin/release/src/router/dropbear
          OUT=reports/scp-standalone-source.txt
          : > "$OUT"

          pass() { echo "PASS $*" | tee -a "$OUT"; }
          fail() { echo "FAIL $*" | tee -a "$OUT"; return 1; }
          have() { grep -Fq "$2" "$1" && pass "$3" || fail "$3"; }

          have "$A/sysoptions.h" '#define DROPBEAR_VERSION "2020.81"' "Clean ASUS Dropbear version pinned"
          have "$M/sysoptions.h" '#define DROPBEAR_VERSION "2022.83"' "Pinned Merlin Dropbear version pinned"

          for root in "$A" "$M"; do
            have "$root/Makefile.in" 'SCPOBJS=scp.o progressmeter.o atomicio.o scpmisc.o compat.o'               "Standalone SCP object set exists in $root"
            have "$root/Makefile.in" "# scp doesn't use the libs so is special."               "SCP is explicitly independent of Dropbear libs in $root"
            have "$root/Makefile.in" 'scp: $(SCPOBJS)'               "Standalone SCP target exists in $root"
            have "$root/default_options.h" '#define DROPBEAR_PATH_SSH_PROGRAM "/usr/bin/dbclient"'               "Standalone SCP delegates SSH to /usr/bin/dbclient in $root"
          done

          have "$M/scp.c" 'execvp(ssh_program, args.list)' "SCP executes configured SSH transport"
          have "$M/scp.c" 'char *ssh_program = DROPBEAR_PATH_SSH_PROGRAM' "SCP initializes transport from fixed Dropbear path"

          echo 'CLASSIFICATION M16_ADD_ONLY_STANDALONE_SCP_BUILD' | tee -a "$OUT"
          echo 'DO_NOT_REPLACE_ASUS_DROPBEAR' | tee -a "$OUT"

      - name: Build static AArch64 standalone SCP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user-static file make

          M=work/merlin/release/src/router/dropbear
          OUT=reports/scp-standalone-source.txt
          mkdir -p artifacts work/scp-smoke

          cd "$M"
          make distclean >/dev/null 2>&1 || true
          CC=aarch64-linux-gnu-gcc \
          AR=aarch64-linux-gnu-ar \
          RANLIB=aarch64-linux-gnu-ranlib \
          STRIP=aarch64-linux-gnu-strip \
          CFLAGS='-Os' \
          LDFLAGS='-Wl,--build-id=none' \
            ./configure \
              --host=aarch64-linux-gnu \
              --enable-static \
              --disable-zlib \
              --enable-bundled-libtom \
              > "$GITHUB_WORKSPACE/reports/scp-configure.log" 2>&1

          make -j2 PROGRAMS=scp MULTI=0 SCPPROGRESS=1 scp \
            > "$GITHUB_WORKSPACE/reports/scp-build.log" 2>&1
          aarch64-linux-gnu-strip scp
          cp scp "$GITHUB_WORKSPACE/artifacts/rtac86u-scp"
          chmod 0755 "$GITHUB_WORKSPACE/artifacts/rtac86u-scp"
          cd "$GITHUB_WORKSPACE"

          echo '===== BUILT SCP =====' | tee -a "$OUT"
          file artifacts/rtac86u-scp | tee -a "$OUT"
          sha256sum artifacts/rtac86u-scp | tee -a "$OUT"
          stat -c 'size=%s mode=%a' artifacts/rtac86u-scp | tee -a "$OUT"
          aarch64-linux-gnu-readelf -l artifacts/rtac86u-scp | tee reports/scp-readelf.txt >> "$OUT"

          file artifacts/rtac86u-scp | grep -Eq 'ELF 64-bit.*ARM aarch64|ELF 64-bit.*AArch64'
          if aarch64-linux-gnu-readelf -l artifacts/rtac86u-scp | grep -q 'INTERP'; then
            echo 'FAIL standalone SCP has PT_INTERP' | tee -a "$OUT"
            exit 1
          fi
          echo 'PASS standalone SCP is static AArch64/no PT_INTERP' | tee -a "$OUT"

          strings artifacts/rtac86u-scp | grep -Fxq '/usr/bin/dbclient'
          echo 'PASS compiled SCP embeds ASUS dbclient transport path' | tee -a "$OUT"

      - name: QEMU SCP smoke tests
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/artifacts/rtac86u-scp"
          OUT="$GITHUB_WORKSPACE/reports/scp-standalone-source.txt"
          S="$GITHUB_WORKSPACE/work/scp-smoke"
          rm -rf "$S"
          mkdir -p "$S/src dir" "$S/dst dir"

          set +e
          qemu-aarch64-static "$BIN" > reports/scp-usage.txt 2>&1
          usage_rc=$?
          set -e
          cat reports/scp-usage.txt | tee -a "$OUT"
          [ "$usage_rc" -ne 0 ]
          grep -Fq 'usage: scp' reports/scp-usage.txt
          echo 'PASS standalone usage path executes under qemu-aarch64' | tee -a "$OUT"

          printf 'scp-local-copy-test\n' > "$S/src dir/file one.txt"
          qemu-aarch64-static "$BIN" "$S/src dir/file one.txt" "$S/dst dir/copied file.txt"
          cmp "$S/src dir/file one.txt" "$S/dst dir/copied file.txt"
          echo 'PASS local-to-local copy path works under qemu-aarch64' | tee -a "$OUT"

          set +e
          qemu-aarch64-static "$BIN" -S /bin/false "$S/src dir/file one.txt" example.invalid:/tmp/x \
            > reports/scp-remote.out 2> reports/scp-remote.err
          remote_rc=$?
          set -e
          echo "remote_false_rc=$remote_rc" | tee -a "$OUT"
          [ "$remote_rc" -ne 0 ]
          echo 'PASS remote path honors -S transport override and fails closed' | tee -a "$OUT"

      - name: Verify clean rebuild reproducibility
        run: |
          set -euo pipefail
          M=work/merlin/release/src/router/dropbear
          OUT=reports/scp-standalone-source.txt
          first="$(sha256sum artifacts/rtac86u-scp | awk '{print $1}')"

          cd "$M"
          make clean >/dev/null 2>&1 || true
          make -j2 PROGRAMS=scp MULTI=0 SCPPROGRESS=1 scp \
            > "$GITHUB_WORKSPACE/reports/scp-rebuild.log" 2>&1
          aarch64-linux-gnu-strip scp
          cp scp "$GITHUB_WORKSPACE/artifacts/rtac86u-scp-rebuild"
          cd "$GITHUB_WORKSPACE"

          second="$(sha256sum artifacts/rtac86u-scp-rebuild | awk '{print $1}')"
          echo "first_hash=$first" | tee -a "$OUT"
          echo "second_hash=$second" | tee -a "$OUT"
          cmp artifacts/rtac86u-scp artifacts/rtac86u-scp-rebuild
          echo 'PASS standalone SCP clean rebuild is byte-identical' | tee -a "$OUT"
          echo 'CLASSIFICATION M16_STATIC_AARCH64_ADD_ONLY_CANDIDATE' | tee -a "$OUT"

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-standalone-source
          path: |
            reports/scp-standalone-source.txt
            reports/scp-configure.log
            reports/scp-build.log
            reports/scp-rebuild.log
            reports/scp-readelf.txt
            reports/scp-usage.txt
            reports/scp-remote.out
            reports/scp-remote.err
            artifacts/rtac86u-scp
            artifacts/rtac86u-scp-rebuild
          if-no-files-found: warn
          retention-days: 30
