name: Probe ASUS 52334 Merlin SSH behavior

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/ssh-merlin-behavior-52334.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip file binutils
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch and extract verified images
        run: |
          set -euo pipefail
          mkdir -p work/asus work/merlin work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/asus.zip \
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/merlin.zip \
            'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/asus.zip' | sha256sum -c -
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/artifacts/merlin.zip' | sha256sum -c -
          unzip -q work/artifacts/asus.zip -d work/asus
          unzip -q work/artifacts/merlin.zip -d work/merlin
          for d in asus merlin; do
            (
              cd "work/$d"
              FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
              test -n "$FW"
              binwalk -Me "$FW" >/dev/null
            )
            ROOT="$(find "work/$d" -type d -name rootfs_ubifs -print -quit)"
            test -n "$ROOT"
            if [ "$d" = asus ]; then echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"; else echo "MERLIN_ROOT=$ROOT" >> "$GITHUB_ENV"; fi
          done

      - name: Compare SSH and SCP surfaces
        run: |
          set -euo pipefail
          A="$ASUS_ROOT"; M="$MERLIN_ROOT"; OUT=reports/ssh-merlin-behavior-52334.txt
          : > "$OUT"

          echo '===== SSH FILE SURFACE =====' >> "$OUT"
          paths='usr/bin/scp usr/bin/ssh usr/bin/dropbearconvert usr/bin/dropbearkey usr/sbin/dropbear usr/bin/dropbearmulti sbin/dropbearmulti'
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            for rel in $paths; do
              p="$R/$rel"
              if [ -e "$p" ] || [ -L "$p" ]; then
                echo "$rel -> $(readlink "$p" || true)" >> "$OUT"
                file -L "$p" >> "$OUT" || true
                if [ -f "$(readlink -f "$p" 2>/dev/null || true)" ]; then
                  sha256sum "$(readlink -f "$p")" >> "$OUT" || true
                fi
              else
                echo "MISSING $rel" >> "$OUT"
              fi
            done
          done

          echo '===== SCP TARGET CLASSIFICATION =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            p="$R/usr/bin/scp"
            if [ ! -e "$p" ] && [ ! -L "$p" ]; then
              echo "$side scp=MISSING" >> "$OUT"
              continue
            fi
            resolved="$(readlink -f "$p" || true)"
            echo "$side scp_resolved=$resolved" >> "$OUT"
            if [ -n "$resolved" ]; then
              echo "$side scp_file=$(file -b "$resolved")" >> "$OUT"
              readelf -d "$resolved" 2>/dev/null | grep NEEDED >> "$OUT" || true
            fi
          done

          echo '===== DROPBEAR APPLET STRINGS =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            multi="$(find "$R/bin" "$R/sbin" "$R/usr/bin" "$R/usr/sbin" -maxdepth 1 -type f -name '*dropbear*' -print -quit 2>/dev/null || true)"
            echo "--- $side multi=$multi ---" >> "$OUT"
            if [ -n "$multi" ]; then
              strings -a "$multi" | grep -Ex 'scp|ssh|dropbear|dropbearkey|dropbearconvert|dbclient' | sort -u >> "$OUT" || true
            fi
          done

          echo '===== RC SSH CONTRACT =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            for sig in authorized_keys dropbear_rsa_host_key dropbear_ecdsa_host_key dropbear_ed25519_host_key sshd_authkeys sshd_pass sshd_port sshd_enable; do
              if strings -a "$R/sbin/rc" | grep -Fq "$sig"; then
                echo "PASS $sig" >> "$OUT"
              else
                echo "MISSING $sig" >> "$OUT"
              fi
            done
          done

          echo '===== CLASSIFICATION HINT =====' >> "$OUT"
          merlin_scp="$M/usr/bin/scp"
          if [ -L "$merlin_scp" ]; then
            tgt="$(readlink -f "$merlin_scp" || true)"
            case "$(basename "$tgt")" in
              *dropbear*) echo 'MERLIN_SCP=DROPBEAR_MULTICALL_DEPENDENT' >> "$OUT" ;;
              *) echo 'MERLIN_SCP=SYMLINK_OTHER' >> "$OUT" ;;
            esac
          elif [ -f "$merlin_scp" ]; then
            echo 'MERLIN_SCP=STANDALONE_FILE' >> "$OUT"
          else
            echo 'MERLIN_SCP=MISSING' >> "$OUT"
          fi
          cat "$OUT"

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: ssh-merlin-behavior-52334
          path: reports/ssh-merlin-behavior-52334.txt
          if-no-files-found: error
          retention-days: 14
