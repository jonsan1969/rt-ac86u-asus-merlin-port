name: Probe ASUS 52334 custom DDNS callback

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/ddns-custom-52334.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch and extract verified ASUS 52334
        run: |
          set -euo pipefail
          mkdir -p work/asus work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/fw.zip             'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/fw.zip' | sha256sum -c -
          unzip -q work/artifacts/fw.zip -d work/asus
          cd work/asus
          FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
          binwalk -Me "$FW" >/dev/null
          cd ../..
          ROOT="$(find work/asus -type d -name rootfs_ubifs -print -quit)"
          test -n "$ROOT"
          echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Probe DDNS custom script contract
        run: |
          set -euo pipefail
          R="$ASUS_ROOT"; OUT=reports/ddns-custom-52334.txt
          : > "$OUT"
          section() { printf '\n===== %s =====\n' "$1" >> "$OUT"; }

          section 'RC TOKENS'
          for sig in ddns_custom_updated ddns-start ddns-started ddns_update_x ddns_server_x WWW.CUSTOM; do
            if strings -a "$R/sbin/rc" | grep -Fq "$sig"; then echo "PASS rc::$sig" >> "$OUT"; else echo "MISSING rc::$sig" >> "$OUT"; fi
          done

          section 'HTTPD/UI TOKENS'
          for sig in WWW.CUSTOM ddns_custom_updated ddns-start; do
            n=0
            strings -a "$R/usr/sbin/httpd" | grep -Fq "$sig" && n=$((n+1)) || true
            grep -RIl --binary-files=without-match -F "$sig" "$R/www" 2>/dev/null | grep -q . && n=$((n+1)) || true
            echo "$sig components=$n" >> "$OUT"
          done

          section 'DDNS WEB CONTEXT'
          grep -RInaE --binary-files=without-match 'WWW\.CUSTOM|ddns_custom|ddns-start|ddns_server_x' "$R/www" 2>/dev/null | head -n 500 >> "$OUT" || true

          section 'CLASSIFICATION'
          if strings -a "$R/sbin/rc" | grep -Fq 'ddns_custom_updated' &&
             strings -a "$R/sbin/rc" | grep -Fq 'ddns-start'; then
            echo 'CLASSIFICATION=IMAGE_UI_ADAPT_CANDIDATE' >> "$OUT"
          elif strings -a "$R/sbin/rc" | grep -Fq 'WWW.CUSTOM'; then
            echo 'CLASSIFICATION=PARTIAL_CORE_SUPPORT_REVIEW' >> "$OUT"
          else
            echo 'CLASSIFICATION=RC_SOURCE_REQUIRED' >> "$OUT"
          fi
          cat "$OUT"
      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: ddns-custom-52334
          path: reports/ddns-custom-52334.txt
          if-no-files-found: error
          retention-days: 14
