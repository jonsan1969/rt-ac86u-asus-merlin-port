name: KoolCenter 386.14_2 security delta

on:
  push:
    branches: [asus-52334-merlin-port]
    paths: [.github/workflows/koolcenter-38614-security-delta.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full file unzip
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Download exact candidate and references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/kc work/merlin work/asus52334 reports
          curl -fL --retry 4 --retry-all-errors -o work/kc/RT-AC86U_386.14_2_cferom_ubi-87b7285.w 'https://fw.koolcenter.com/KoolCenter_Merlin_New_Gen_386/RT-AC86U/RT-AC86U_386.14_2_cferom_ubi-87b7285.w'
          echo '0e640a4ac8f7b30a29485c26f14c3e564c9f391a4800333ffa21e67af021615e  work/kc/RT-AC86U_386.14_2_cferom_ubi-87b7285.w' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o work/merlin.zip 'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/merlin.zip' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o work/asus52334.zip 'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          unzip -q work/merlin.zip -d work/merlin
          unzip -q work/asus52334.zip -d work/asus52334
          sha256sum work/kc/*.w work/merlin/*.w work/asus52334/*.w > reports/image-sha256.txt
      - name: Extract rootfs
        shell: bash
        run: |
          set -euo pipefail
          for d in kc merlin asus52334; do
            (cd work/$d; FW="$(find . -maxdepth 1 -name '*.w' -print -quit)"; binwalk -Me "$FW") > reports/binwalk-$d.txt
          done
          for d in kc merlin asus52334; do
            R="$(find work/$d -type d -name rootfs_ubifs -print -quit)"; test -n "$R"; echo "$d=$R" >> reports/rootfs-paths.txt
          done
      - name: Inventory, deltas and security probes
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          AS="$(sed -n 's/^asus52334=//p' reports/rootfs-paths.txt)"
          python3 tools/tree_inventory.py "$KC" -o reports/koolcenter-inventory.tsv
          python3 tools/tree_inventory.py "$ME" -o reports/merlin-inventory.tsv
          python3 tools/tree_inventory.py "$AS" -o reports/asus52334-inventory.tsv
          python3 tools/compare_trees.py "$ME" "$KC" -o reports/merlin-vs-koolcenter.tsv | tee reports/merlin-vs-koolcenter-summary.txt
          python3 tools/compare_trees.py "$AS" "$KC" -o reports/asus52334-vs-koolcenter.tsv | tee reports/asus52334-vs-koolcenter-summary.txt
          printf 'path\\tkc\\tmerlin\\tasus52334\\tkc_eq_merlin\\tkc_eq_asus52334\\n' > reports/security-sensitive-hashes.tsv
          for p in /usr/sbin/httpd /sbin/rc /usr/sbin/dnsmasq /usr/sbin/dropbear /usr/bin/openssl /usr/sbin/openvpn /bin/busybox; do
            hkc='-'; hme='-'; has='-'
            [ -f "$KC$p" ] && hkc="$(sha256sum "$KC$p" | cut -d' ' -f1)"
            [ -f "$ME$p" ] && hme="$(sha256sum "$ME$p" | cut -d' ' -f1)"
            [ -f "$AS$p" ] && has="$(sha256sum "$AS$p" | cut -d' ' -f1)"
            [ "$hkc" != '-' ] && [ "$hkc" = "$hme" ] && eqm=true || eqm=false
            [ "$hkc" != '-' ] && [ "$hkc" = "$has" ] && eqa=true || eqa=false
            printf '%s\\t%s\\t%s\\t%s\\t%s\\t%s\\n' "$p" "$hkc" "$hme" "$has" "$eqm" "$eqa" >> reports/security-sensitive-hashes.tsv
          done
          {
            echo '=== kool/softcenter files ==='
            find "$KC" -iname '*kool*' -o -iname '*softcenter*' | sort
            echo '=== cloud components ==='
            find "$KC" -type f | grep -Ei '/(asd|awsiot|ifttt|alexa)(/|$)|/(asd|awsiot|ifttt|alexa)$' || true
            echo '=== executable scripts network/update indicators ==='
            grep -RInaE 'curl |wget |http://|https://|eval |system\(|/jffs/|koolshare|softcenter' "$KC"/koolshare "$KC"/usr "$KC"/etc 2>/dev/null | head -n 5000 || true
          } > reports/security-probes.txt
          mkdir -p reports/kc-selected
          for p in \
            /rom/etc/koolshare/scripts/center_config.sh \
            /rom/etc/koolshare/scripts/ks_app_install.sh \
            /rom/etc/koolshare/scripts/ks_tar_install.sh \
            /rom/etc/koolshare/bin/kscore.sh \
            /usr/sbin/webs_update.sh \
            /usr/sbin/webs_upgrade.sh \
            /usr/sbin/webs_note.sh \
            /usr/bin/jffsinit.sh; do
            if [ -f "$KC$p" ]; then
              mkdir -p "reports/kc-selected$(dirname "$p")"
              cp -a "$KC$p" "reports/kc-selected$p"
            fi
          done
          for p in /usr/sbin/httpd /sbin/rc /bin/busybox /usr/sbin/lighttpd /usr/sbin/miniupnpd /usr/sbin/wget; do
            if [ -f "$KC$p" ]; then
              echo "=== $p ===" >> reports/kc-binary-strings.txt
              strings -a "$KC$p" | grep -Ei 'kool|softcenter|https?://|version|openssl|ssl|curl|wget|upgrade|upload|jffs|asus' | head -n 500 >> reports/kc-binary-strings.txt || true
            fi
          done
      - name: Component lineage probes
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          AS="$(sed -n 's/^asus52334=//p' reports/rootfs-paths.txt)"
          : > reports/component-lineage.txt
          for p in /lib/libcrypto.so.1.1 /lib/libssl.so.1.1 /usr/lib/libcurl.so.4 /usr/sbin/httpd /usr/sbin/lighttpd /usr/sbin/miniupnpd /usr/bin/wget /bin/busybox /sbin/rc; do
            echo "===== $p =====" >> reports/component-lineage.txt
            for pair in "KC:$KC" "MERLIN:$ME" "ASUS52334:$AS"; do
              n="${pair%%:*}"; r="${pair#*:}"; q="$r$p"
              echo "--- $n ---" >> reports/component-lineage.txt
              if [ -e "$q" ]; then
                readlink "$q" >> reports/component-lineage.txt 2>/dev/null || true
                file "$q" >> reports/component-lineage.txt || true
                sha256sum "$q" >> reports/component-lineage.txt || true
                strings -a "$q" 2>/dev/null | grep -Ei 'OpenSSL [0-9]|libcurl|curl [0-9]|lighttpd|miniupnp|BusyBox v|wget [0-9]|version|ASUSWRT|Merlin|kool' | head -n 80 >> reports/component-lineage.txt || true
              else
                echo MISSING >> reports/component-lineage.txt
              fi
            done
          done
      - name: Web and auth delta probes
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          AS="$(sed -n 's/^asus52334=//p' reports/rootfs-paths.txt)"
          {
            echo '=== changed web/auth/security paths Merlin -> KoolCenter ==='
            awk -F '\t' 'NR==1 || $1 ~ /(www|httpd|lighttpd|auth|login|passwd|shadow|ssl|crypto|curl|wget|upgrade|upload|update|jffs|koolshare|softcenter)/' reports/merlin-vs-koolcenter.tsv
            echo '=== KoolCenter httpd strings ==='
            strings -a "$KC/usr/sbin/httpd" | grep -Ei 'login|auth|passwd|upload|upgrade|update|jffs|kool|soft|csrf|token|referer|cookie|session|https?|ssl' | head -n 2000 || true
            echo '=== Merlin httpd strings ==='
            strings -a "$ME/usr/sbin/httpd" | grep -Ei 'login|auth|passwd|upload|upgrade|update|jffs|kool|soft|csrf|token|referer|cookie|session|https?|ssl' | head -n 2000 || true
            echo '=== ASUS52334 httpd strings ==='
            strings -a "$AS/usr/sbin/httpd" | grep -Ei 'login|auth|passwd|upload|upgrade|update|jffs|csrf|token|referer|cookie|session|https?|ssl' | head -n 2000 || true
          } > reports/web-auth-delta.txt
      - name: Runtime exposure and persistence probes
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          {
            echo '=== koolshare/softcenter startup and persistence ==='
            grep -RInaE 'koolshare|softcenter|kscore|skipd|jffs2_scripts|service-event|services-start|nat-start|firewall-start' "$KC"/etc "$KC"/rom "$KC"/usr "$KC"/sbin 2>/dev/null | head -n 6000 || true
            echo '=== listener/bind/port indicators in KoolCenter additions ==='
            find "$KC"/rom/etc/koolshare "$KC"/koolshare -type f 2>/dev/null -print0 | xargs -0 grep -InaE '0\.0\.0\.0|127\.0\.0\.1|listen|server\.port|:[0-9]{2,5}|iptables|INPUT|ACCEPT|DROP|firewall|wan0|wan_if|lan_if' 2>/dev/null | head -n 5000 || true
            echo '=== remote admin / web exposure indicators ==='
            grep -RInaE 'http_enable|https_lanport|misc_http_x|misc_httpsport_x|http_lanport|webdav|enable_webdav|wan.*http|remote.*admin' "$KC"/etc "$KC"/rom "$KC"/usr "$KC"/sbin 2>/dev/null | head -n 4000 || true
            echo '=== crypto/ssl symlink topology ==='
            find "$KC"/lib "$KC"/usr/lib -maxdepth 2 \( -name 'libssl*' -o -name 'libcrypto*' -o -name 'libcurl*' \) -exec ls -l {} \; 2>/dev/null
            echo '=== Merlin crypto/ssl symlink topology ==='
            find "$ME"/lib "$ME"/usr/lib -maxdepth 2 \( -name 'libssl*' -o -name 'libcrypto*' -o -name 'libcurl*' \) -exec ls -l {} \; 2>/dev/null
          } > reports/runtime-exposure-persistence.txt
      - name: Security delta classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, pathlib, collections
          p=pathlib.Path("reports/merlin-vs-koolcenter.tsv")
          rows=list(csv.DictReader(p.open(), delimiter="\t"))
          keys=("/http","/www/","httpd","auth","login","upload","upgrade","update","ssl","crypto","curl","wget","dnsmasq","dropbear","openvpn","miniupnp","iptables","firewall","jffs","koolshare","softcenter")
          out=[]
          for r in rows:
              path=(r.get("path") or r.get("Path") or next(iter(r.values()))).lower()
              if any(k in path for k in keys):
                  out.append(r)
          with open("reports/security-delta-classified.tsv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys(),delimiter="\t"); w.writeheader(); w.writerows(out)
          print("security-relevant delta rows",len(out))
          PY
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          AS="$(sed -n 's/^asus52334=//p' reports/rootfs-paths.txt)"
          {
            echo '=== ASUS52334 vs KoolCenter security-sensitive changed paths ==='
            awk -F '\t' 'NR==1 || $1 ~ /(http|www|web|auth|login|upload|upgrade|update|ssl|crypto|curl|wget|dns|dropbear|openvpn|upnp|iptables|firewall)/' reports/asus52334-vs-koolcenter.tsv
            echo '=== passwd/shadow/default credential material ==='
            for root in "$KC" "$ME" "$AS"; do
              echo "--- $root ---"
              for q in /etc/passwd /etc/shadow /etc/group; do if [ -f "$root$q" ]; then echo "[$q]"; cat "$root$q"; fi; done
            done
          } > reports/security-gap-to-52334.txt
      - name: SoftCenter web attack-surface map
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          OUT=reports/softcenter-web-attack-surface.txt
          {
            echo '=== SoftCenter/Koolshare web assets and executable scripts ==='
            find "$KC"/www "$KC"/rom/etc/koolshare "$KC"/usr -type f 2>/dev/null | grep -Ei 'softcenter|softsetting|koolshare|ks_|dbus|httpdb' | sort || true
            echo '=== web assets: CGI/API/action/dbus/command references ==='
            grep -RInaE 'cgi|_api|applydb|dbus|action_script|action_mode|SystemCmd|shell|exec|command|upload|download|install|uninstall|tar_url|md5' "$KC"/www "$KC"/rom/etc/koolshare 2>/dev/null | grep -Ei 'soft|kool|dbus|cgi|api|action|command|install|upload' | head -n 12000 || true
            echo '=== httpd handler strings around KoolCenter endpoints ==='
            strings -a "$KC/usr/sbin/httpd" 2>/dev/null | grep -Ei 'kool|softcenter|softsetting|dbus|applydb|cgi|upload|install|action_script|login|auth|token|session|cookie' | head -n 5000 || true
            echo '=== startup/init hooks ==='
            grep -RInaE 'kscore|koolshare|softcenter|/jffs/scripts|services-start|service-event|nat-start|firewall-start|wan-start|post-mount' "$KC"/etc "$KC"/rom "$KC"/usr "$KC"/sbin 2>/dev/null | head -n 8000 || true
            echo '=== potentially dangerous shell construction in Koolshare scripts ==='
            grep -RInaE '(^|[;&|[:space:]])(eval|sh -c|bash -c|system|exec)[[:space:]]|\$\([^)]*dbus|dbus get|nvram get|start-stop-daemon|chmod .*[+]x|tar -|wget |curl ' "$KC"/rom/etc/koolshare 2>/dev/null | head -n 10000 || true
          } > "$OUT"
      - name: SoftCenter authentication-boundary probes
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          OUT=reports/softcenter-auth-boundary.txt
          {
            echo '=== SoftCenter pages/forms/actions ==='
            grep -RInaE '<form|action=|ajax|\.cgi|_api|applydb|dbus|login|auth|token|cookie|session' "$KC/www" 2>/dev/null | grep -Ei 'softcenter|softsetting|kool|dbus|cgi|api|apply' | head -n 10000 || true
            echo '=== httpd public/no-auth/auth-exception vocabulary ==='
            strings -a "$KC/usr/sbin/httpd" 2>/dev/null | grep -Ei 'no.?auth|auth|login|logout|cookie|session|token|referer|public|except|whitelist|cgi|applydb|dbus|softcenter|softsetting|kool' | head -n 8000 || true
            echo '=== exact SoftCenter endpoint names in httpd ==='
            for x in Module_Softcenter.asp Module_Softsetting.asp applydb.cgi dbconf.cgi _api; do
              echo "--- $x"; strings -a "$KC/usr/sbin/httpd" 2>/dev/null | grep -F "$x" || true
            done
          } > "$OUT"
      - name: ELF dependency and code-section audit
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          AS="$(sed -n 's/^asus52334=//p' reports/rootfs-paths.txt)"
          OUT=reports/elf-security-dependencies.txt
          : > "$OUT"
          for rel in /usr/sbin/httpd /sbin/rc /usr/sbin/wget /usr/sbin/lighttpd /usr/sbin/miniupnpd /usr/sbin/openvpn /usr/sbin/dropbear /usr/sbin/dnsmasq /bin/busybox; do
            echo "===== $rel =====" >> "$OUT"
            for spec in "KC:$KC" "MERLIN:$ME" "ASUS52334:$AS"; do
              tag="${spec%%:*}"; root="${spec#*:}"; p="$root$rel"
              echo "--- $tag" >> "$OUT"
              if [ -f "$p" ]; then
                sha256sum "$p" >> "$OUT"
                readelf -d "$p" 2>/dev/null | grep -E 'NEEDED|SONAME|RPATH|RUNPATH' >> "$OUT" || true
                readelf -n "$p" 2>/dev/null | grep -E 'Build ID|GNU' >> "$OUT" || true
                objcopy --dump-section .text=/tmp/text.bin "$p" 2>/dev/null && { printf '.text '; sha256sum /tmp/text.bin; } >> "$OUT" || true
              else
                echo MISSING >> "$OUT"
              fi
            done
          done
      - name: Minimal Merlin hardening feasibility
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          AS="$(sed -n 's/^asus52334=//p' reports/rootfs-paths.txt)"
          OUT=reports/minimal-merlin-hardening-feasibility.txt
          {
            echo '=== candidate binaries: dynamic dependencies and interpreters ==='
            for rel in /usr/sbin/dnsmasq /usr/sbin/dropbear /usr/sbin/openvpn /usr/sbin/httpd /usr/sbin/miniupnpd /usr/sbin/lighttpd /usr/sbin/wget /bin/busybox; do
              echo "===== $rel ====="
              for spec in "MERLIN:$ME" "KC:$KC" "ASUS52334:$AS"; do
                tag="${spec%%:*}"; root="${spec#*:}"; p="$root$rel"; echo "--- $tag"
                if [ -f "$p" ]; then
                  file "$p" || true
                  readelf -l "$p" 2>/dev/null | grep -F 'Requesting program interpreter' || true
                  readelf -d "$p" 2>/dev/null | grep NEEDED || true
                  strings -a "$p" | grep -Eim 12 'OpenSSL [0-9]|OpenVPN [0-9]|Dropbear|dnsmasq-[0-9]|miniupnpd|BusyBox v|lighttpd/[0-9]|wget [0-9]' || true
                else echo MISSING; fi
              done
            done
            echo '=== Merlin shared-library dependency fanout for crypto/curl ==='
            for lib in libssl.so.1.1 libcrypto.so.1.1 libcurl.so.4; do
              echo "--- consumers of $lib"
              find "$ME" -type f -perm /111 2>/dev/null | while read -r p; do
                readelf -d "$p" 2>/dev/null | grep -q "$lib" && echo "${p#$ME}" || true
              done | sort
            done
            echo '=== KC files changed versus Merlin among selected candidates ==='
            for rel in /usr/sbin/dnsmasq /usr/sbin/dropbear /usr/sbin/openvpn /usr/sbin/httpd /usr/sbin/miniupnpd /usr/sbin/lighttpd /usr/sbin/wget /bin/busybox /usr/lib/libssl.so.1.1 /usr/lib/libcrypto.so.1.1 /usr/lib/libcurl.so.4.8.0; do
              [ -e "$ME$rel" ] && [ -e "$KC$rel" ] && { printf '%s\t' "$rel"; cmp -s "$ME$rel" "$KC$rel" && echo SAME || echo DIFFERENT; } || true
            done
          } > "$OUT"
      - name: Exact isolated daemon version probes
        shell: bash
        run: |
          set -euo pipefail
          ME="$(sed -n 's/^merlin=//p' reports/rootfs-paths.txt)"
          OUT=reports/isolated-daemon-versions.txt
          {
            for rel in /usr/sbin/dnsmasq /usr/sbin/dropbear /usr/sbin/openvpn; do
              echo "===== $rel ====="
              p="$ME$rel"
              sha256sum "$p" || true
              strings -a "$p" 2>/dev/null | grep -Ei 'dnsmasq[- /]?[0-9]+\.[0-9]+|Dropbear[^[:cntrl:]]*[0-9]{4}\.[0-9]+|OpenVPN [0-9]+\.[0-9]+\.[0-9]+|OpenSSL [0-9]+\.[0-9]+\.[0-9]+[a-z]?' | sort -u | head -n 100 || true
            done
          } > "$OUT"
      - name: SoftCenter disablement feasibility
        shell: bash
        run: |
          set -euo pipefail
          KC="$(sed -n 's/^kc=//p' reports/rootfs-paths.txt)"
          OUT=reports/softcenter-disablement.txt
          {
            echo '=== enable/disable/state variables ==='
            grep -RInaE 'softcenter.*(enable|disable)|koolshare.*(enable|disable)|sc_[A-Za-z0-9_]*(enable|status)|ks_[A-Za-z0-9_]*(enable|status)|dbus (get|set).*enable|nvram (get|set).*soft|nvram (get|set).*kool' "$KC"/rom/etc/koolshare "$KC"/usr "$KC"/etc "$KC"/www 2>/dev/null | head -n 12000 || true
            echo '=== startup entry points ==='
            grep -RInaE 'kscore\.sh|koolshare|softcenter' "$KC"/etc/init.d "$KC"/etc "$KC"/rom/etc "$KC"/usr 2>/dev/null | grep -Ei 'start|init|boot|service|jffs|kscore|koolshare|softcenter' | head -n 12000 || true
            echo '=== reset/uninstall behavior ==='
            for p in "$KC/usr/bin/koolshare-reset" "$KC/rom/etc/koolshare/bin/kscore.sh"; do
              echo "--- $p"; [ -f "$p" ] && sed -n '1,260p' "$p" || true
            done
          } > "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: koolcenter-38614-security-delta
          path: reports/
          retention-days: 14
