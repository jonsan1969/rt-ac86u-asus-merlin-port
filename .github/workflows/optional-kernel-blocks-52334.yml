name: Probe optional kernel feature blocks on ASUS 52334

on:
  push:
    branches:
      - asus-52334-merlin-port
    paths:
      - .github/workflows/optional-kernel-blocks-52334.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction and module tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binwalk mtd-utils squashfs-tools p7zip-full unzip file binutils kmod
          python3 -m pip install --user --break-system-packages ubi-reader
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch and extract verified images
        run: |
          set -euo pipefail
          mkdir -p work/asus work/merlin work/artifacts reports
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/asus.zip \
            'https://dlcdnets.asus.com/pub/ASUS/wireless/RT-AC86U/FW_RT-AC86U_300438652334.zip?model=RT-AC86U'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o work/artifacts/merlin.zip \
            'https://sourceforge.net/projects/asuswrt-merlin/files/RT-AC86U/Release/RT-AC86U_386.14_2.zip/download'
          echo 'e8fd0f3a26db4fe9cf6acb64272d2b78247eb9ccf3890fbdb8daace0bac10d61  work/artifacts/asus.zip' | sha256sum -c -
          echo '1dedab53b08b93c529920c791291d04e36089a9c85d672a5a0fff9dea45bb49a  work/artifacts/merlin.zip' | sha256sum -c -
          unzip -q work/artifacts/asus.zip -d work/asus
          unzip -q work/artifacts/merlin.zip -d work/merlin
          for d in asus merlin; do
            (
              cd "work/$d"
              FW="$(find . -maxdepth 1 -type f -name '*.w' -print -quit)"
              test -n "$FW"
              binwalk -Me "$FW" >/dev/null
            )
            ROOT="$(find "work/$d" -type d -name rootfs_ubifs -print -quit)"
            test -n "$ROOT"
            if [ "$d" = asus ]; then echo "ASUS_ROOT=$ROOT" >> "$GITHUB_ENV"; else echo "MERLIN_ROOT=$ROOT" >> "$GITHUB_ENV"; fi
          done

      - name: Compare kernel and userland feature surfaces
        run: |
          set -euo pipefail
          A="$ASUS_ROOT"; M="$MERLIN_ROOT"; OUT=reports/optional-kernel-blocks-52334.txt
          : > "$OUT"

          echo '===== MODULE TREE ROOTS =====' >> "$OUT"
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            find "$R/lib/modules" -maxdepth 2 -type d -printf '%P\n' 2>/dev/null | head -n 80 >> "$OUT" || true
          done

          echo '===== FEATURE MODULES =====' >> "$OUT"
          for feature in NFS CIFS IPSET CAKE WIREGUARD; do
            echo "### $feature" >> "$OUT"
            case "$feature" in
              NFS) rx='/(nfs|nfsd|sunrpc|lockd|grace)\.ko$' ;;
              CIFS) rx='/cifs\.ko$' ;;
              IPSET) rx='/(ip_set|xt_set|ip_set_[^/]+)\.ko$' ;;
              CAKE) rx='/(sch_cake|act_ctinfo)\.ko$' ;;
              WIREGUARD) rx='/wireguard\.ko$' ;;
            esac
            for side in ASUS MERLIN; do
              [ "$side" = ASUS ] && R="$A" || R="$M"
              echo "--- $side ---" >> "$OUT"
              mapfile -t mods < <(find "$R/lib/modules" -type f -name '*.ko' 2>/dev/null | grep -E "$rx" || true)
              if [ "${#mods[@]}" -eq 0 ]; then
                echo 'NONE' >> "$OUT"
              else
                for p in "${mods[@]}"; do
                  rel="${p#"$R/"}"
                  echo "$rel sha256=$(sha256sum "$p" | cut -d' ' -f1)" >> "$OUT"
                  modinfo -F vermagic "$p" 2>/dev/null | sed 's/^/vermagic=/' >> "$OUT" || true
                  modinfo -F depends "$p" 2>/dev/null | sed 's/^/depends=/' >> "$OUT" || true
                done
              fi
            done
          done

          echo '===== USERLAND =====' >> "$OUT"
          paths='usr/sbin/nfsd usr/sbin/mountd usr/sbin/exportfs usr/sbin/showmount usr/sbin/statd usr/sbin/portmap usr/sbin/ipset usr/sbin/wg'
          for side in ASUS MERLIN; do
            [ "$side" = ASUS ] && R="$A" || R="$M"
            echo "--- $side ---" >> "$OUT"
            for rel in $paths; do
              p="$R/$rel"
              if [ -e "$p" ]; then
                printf '%s\t' "$rel" >> "$OUT"
                file -b "$p" >> "$OUT"
                sha256sum "$p" >> "$OUT" || true
              else
                echo "MISSING $rel" >> "$OUT"
              fi
            done
          done

          echo '===== ASUS RC/WEBUI TOKENS =====' >> "$OUT"
          for sig in nfsd_enable nfsd_enable_v2 cifs ipset cake wireguard wg_client wg_server; do
            rc=no; httpd=no
            strings -a "$A/sbin/rc" | grep -Fiq "$sig" && rc=yes || true
            strings -a "$A/usr/sbin/httpd" | grep -Fiq "$sig" && httpd=yes || true
            echo "$sig rc=$rc httpd=$httpd" >> "$OUT"
          done

          echo '===== CLASSIFICATION =====' >> "$OUT"
          echo 'M22=NFS_KERNEL_SOURCE_BUILD_REQUIRED' >> "$OUT"
          echo 'M23=CIFS_KERNEL_SOURCE_BUILD_REQUIRED' >> "$OUT"
          echo 'M27=IPSET_KERNEL_SOURCE_BUILD_REQUIRED' >> "$OUT"
          echo 'M32=CAKE_KERNEL_SOURCE_BUILD_REQUIRED' >> "$OUT"
          echo 'M33=WIREGUARD_KERNEL_SOURCE_BUILD_REQUIRED_UNLESS_ASUS_RUNTIME_PROVES_ALTERNATIVE' >> "$OUT"
          cat "$OUT"

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: optional-kernel-blocks-52334
          path: reports/optional-kernel-blocks-52334.txt
          if-no-files-found: error
          retention-days: 14
